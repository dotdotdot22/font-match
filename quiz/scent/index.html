<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scent Match — what does your taste actually smell like?</title>
<meta name="description" content="Pick between fragrance notes and find out which family you really belong to. Send the link to someone and see how your taste compares.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6F6F3; --paper-shade:#ECEBE5; --ink:#16151A; --ink-soft:#5B5A56;
    --line:#D9D7CF; --accent:#7A4DB8; --accent-soft:#EFE8FA;
    --match:#E63462; --match-soft:#FCE9EE; --radius:4px;
    --display:'Fraunces',serif; --body:'Space Grotesk',sans-serif; --mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--paper);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased;min-height:100vh;}
  a{color:var(--accent);}
  button{font-family:inherit;}
  button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px;}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}

  .frame{max-width:720px;margin:0 auto;padding:28px 20px 60px;min-height:100vh;display:flex;flex-direction:column;}
  .topline{display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:11px;
    letter-spacing:0.08em;text-transform:uppercase;color:var(--ink-soft);padding-bottom:16px;
    border-bottom:1px solid var(--line);margin-bottom:36px;}
  .topline a{color:inherit;text-decoration:none;}
  .topline a:hover{color:var(--ink);}
  .topline .mark{position:relative;width:14px;height:14px;}
  .topline .mark::before,.topline .mark::after{content:"";position:absolute;background:var(--ink-soft);}
  .topline .mark::before{left:50%;top:0;width:1px;height:100%;transform:translateX(-50%);}
  .topline .mark::after{top:50%;left:0;height:1px;width:100%;transform:translateY(-50%);}
  #app{flex:1;display:flex;flex-direction:column;justify-content:center;}

  .landing h1{font-family:var(--display);font-weight:600;font-size:clamp(38px,8.5vw,60px);line-height:1.04;
    margin:0 0 20px;letter-spacing:-0.01em;}
  .landing p.lede{font-size:17px;line-height:1.55;color:var(--ink-soft);max-width:46ch;margin:0 0 32px;}
  .cta{font-family:var(--body);font-weight:600;font-size:15px;background:var(--ink);color:var(--paper);
    border:none;padding:15px 26px;border-radius:var(--radius);cursor:pointer;letter-spacing:0.01em;
    transition:transform .15s ease,background .15s ease;}
  .cta:hover{background:var(--accent);}
  .cta:active{transform:translateY(1px);}
  .cta.ghost{background:transparent;color:var(--ink);border:1px solid var(--ink);}
  .cta.ghost:hover{background:var(--ink);color:var(--paper);}
  .landing .cta{display:block;margin:0 auto;}
  .challenge-banner{font-family:var(--mono);font-size:12px;letter-spacing:0.05em;text-transform:uppercase;
    color:var(--accent);background:var(--accent-soft);display:inline-block;padding:6px 10px;
    border-radius:var(--radius);margin-bottom:18px;}

  .ruler{display:flex;gap:3px;margin-bottom:10px;flex-wrap:nowrap;}
  .rgroup{display:flex;gap:2px;flex:var(--w,1);}
  .tick{flex:1;min-width:3px;height:4px;background:var(--line);border-radius:2px;transition:background .2s ease;}
  .tick.done{background:var(--ink);}
  .tick.current{background:var(--accent);}
  .round-name{font-family:var(--mono);font-size:12px;letter-spacing:0.08em;text-transform:uppercase;
    color:var(--accent);margin-bottom:4px;}
  .round-label{font-family:var(--mono);font-size:12px;letter-spacing:0.08em;text-transform:uppercase;
    color:var(--ink-soft);margin-bottom:8px;}
  .round-word{font-family:var(--mono);font-size:13px;color:var(--ink-soft);margin-bottom:22px;}

  .specimens{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media (max-width:560px){.specimens{grid-template-columns:1fr;}}
  .specimen{background:var(--paper-shade);border:1px solid var(--line);border-radius:var(--radius);
    padding:26px 21px 20px;cursor:pointer;text-align:center;position:relative;min-height:196px;
    display:flex;flex-direction:column;justify-content:center;overflow:hidden;
    transition:border-color .15s ease,background .15s ease,opacity .3s ease;}
  .specimen::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:var(--swatch,var(--line));}
  .specimen:hover{border-color:var(--ink);}
  .specimen.chosen{background:var(--accent-soft);border-color:var(--accent);animation:selectPulse .45s ease-out forwards;}
  .specimen.chosen::after{content:"\2713";position:absolute;top:14px;right:12px;width:28px;height:28px;
    border-radius:50%;background:var(--accent);color:var(--paper);font-size:15px;display:flex;
    align-items:center;justify-content:center;transform:scale(0);
    animation:checkPop .35s cubic-bezier(.34,1.56,.64,1) .05s forwards;}
  .specimen.not-chosen{opacity:.35;}
  @keyframes selectPulse{0%{transform:scale(1);box-shadow:0 0 0 0 rgba(122,77,184,.45);}
    45%{transform:scale(1.035);box-shadow:0 0 0 10px rgba(122,77,184,.12);}
    100%{transform:scale(1.015);box-shadow:0 0 0 14px rgba(122,77,184,0);}}
  @keyframes checkPop{to{transform:scale(1);}}
  .note-name{font-family:var(--display);font-weight:600;font-size:29px;line-height:1.1;
    letter-spacing:-0.01em;word-break:break-word;}
  .note-hint{font-size:14px;line-height:1.45;color:var(--ink-soft);margin-top:10px;max-width:24ch;
    margin-left:auto;margin-right:auto;}
  .note-fam{font-family:var(--mono);font-size:9px;letter-spacing:0.08em;text-transform:uppercase;
    color:var(--ink-soft);margin-top:16px;}
  .specimen.chosen .note-fam{color:var(--accent);}

  .champion-showcase{text-align:center;margin-bottom:22px;}
  .champion-label{font-family:var(--mono);font-size:11px;letter-spacing:0.08em;text-transform:uppercase;
    color:var(--ink-soft);margin-bottom:10px;}
  .champion-word{font-family:var(--display);font-weight:600;font-size:48px;line-height:1.05;
    word-break:break-word;letter-spacing:-0.015em;}
  .champion-hint{font-size:15px;color:var(--ink-soft);margin-top:8px;}
  .dominance-list{display:flex;flex-direction:column;gap:8px;margin-bottom:4px;}
  .dominance-row{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);
    border-radius:var(--radius);border-left:4px solid var(--swatch,var(--line));}
  .dominance-row.champion{background:var(--accent-soft);border-color:var(--accent);
    border-left-color:var(--swatch,var(--accent));}
  .dominance-rank{font-family:var(--mono);font-size:13px;width:28px;flex-shrink:0;color:var(--ink-soft);text-align:center;}
  .dominance-row.champion .dominance-rank{font-size:16px;}
  .dominance-name{flex:1;font-size:15px;color:var(--ink);overflow-wrap:anywhere;}
  .dominance-wins{font-family:var(--mono);font-size:10px;color:var(--ink-soft);white-space:nowrap;
    text-transform:uppercase;letter-spacing:0.05em;}
  .personality-text{font-size:14.5px;line-height:1.6;color:var(--ink-soft);margin:0 0 12px;}
  .lean-note{font-size:13px;line-height:1.5;color:var(--ink-soft);margin:0 0 8px;}
  .lean-note b{color:var(--ink);}
  .wheel-bars{display:flex;flex-direction:column;gap:7px;margin-top:4px;}
  .wheel-row{display:flex;align-items:center;gap:10px;font-size:13px;}
  .wheel-label{width:120px;flex-shrink:0;color:var(--ink-soft);}
  .wheel-track{flex:1;height:8px;background:var(--paper-shade);border-radius:4px;overflow:hidden;}
  .wheel-fill{height:100%;border-radius:4px;}
  .wheel-pct{width:36px;text-align:right;font-family:var(--mono);font-size:11px;color:var(--ink-soft);}
  .gourmand-flag{background:var(--accent-soft);border-radius:var(--radius);padding:13px 15px;
    font-size:13.5px;line-height:1.5;color:var(--ink-soft);margin-top:12px;}
  .gourmand-flag b{color:var(--ink);}

  .result-kicker{font-family:var(--display);font-weight:600;font-size:24px;color:var(--ink);
    margin-bottom:16px;text-align:center;}
  .result-sub{font-size:16px;color:var(--ink-soft);margin-bottom:28px;text-align:center;}
  .stats-section{margin-bottom:28px;}
  .stats-heading{font-family:var(--mono);font-size:11px;letter-spacing:0.08em;text-transform:uppercase;
    color:var(--ink-soft);margin-bottom:12px;}

  .match-breakdown{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:12px;}
  .match-col{display:flex;flex-direction:column;gap:6px;min-width:0;}
  .match-col .col-label{font-family:var(--mono);font-size:11px;letter-spacing:0.08em;text-transform:uppercase;
    color:var(--ink-soft);margin-bottom:2px;}
  .match-col.them .col-label{text-align:left;}
  .match-col.you .col-label{text-align:right;}
  .match-entry{display:flex;align-items:baseline;gap:6px;padding:9px 11px;border-radius:var(--radius);
    border:1px solid var(--line);font-size:13px;line-height:1.25;overflow-wrap:anywhere;}
  .match-col.them .match-entry{justify-content:flex-start;}
  .match-col.you .match-entry{justify-content:flex-end;}
  .match-entry.match{background:var(--match-soft);border-color:var(--match);color:var(--match);font-weight:600;}
  .match-entry .w{font-family:var(--mono);font-size:9px;letter-spacing:0.05em;color:var(--ink-soft);flex-shrink:0;}
  .match-entry.match .w{color:var(--match);}
  .match-center{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:12px 0 28px;}
  .heart-wrap{position:relative;width:88px;height:88px;transform:scale(0.15);opacity:0;
    transition:transform .7s cubic-bezier(.32,1.6,.5,1),opacity .5s ease;}
  .heart-wrap.grown{transform:scale(var(--heart-scale,1));opacity:1;}
  .heart-svg{position:absolute;inset:0;width:100%;height:100%;}
  .heart-outline path{fill:none;stroke:var(--match);stroke-width:1.1;}
  .heart-fill path{fill:var(--match);}
  .match-pct{margin-top:14px;font-family:var(--display);font-weight:600;font-size:36px;color:var(--ink);line-height:1;}
  .match-statement{margin-top:10px;font-size:12.5px;line-height:1.4;color:var(--ink-soft);max-width:24ch;}
  @media (max-width:560px){.match-breakdown{grid-template-columns:1fr;}
    .match-col.you .col-label{text-align:left;}.match-col.you .match-entry{justify-content:flex-start;}}

  .name-box{margin-bottom:12px;}
  .name-box input{width:100%;font-family:var(--body);font-size:14px;padding:12px 14px;border:1px solid var(--line);
    border-radius:var(--radius);background:var(--paper);color:var(--ink);}
  .name-box input::placeholder{color:var(--ink-soft);}
  .share-box{display:flex;gap:8px;margin-bottom:14px;}
  .share-box input{flex:1;font-family:var(--mono);font-size:12px;padding:12px;border:1px solid var(--line);
    border-radius:var(--radius);background:var(--paper-shade);color:var(--ink-soft);}
  .copy-note{font-family:var(--mono);font-size:11px;color:var(--accent);height:16px;margin-bottom:20px;}
  .btn-row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:6px;}
  .affiliate-line{margin-top:36px;padding-top:18px;border-top:1px solid var(--line);font-size:13px;
    line-height:1.55;color:var(--ink-soft);text-align:center;}
  .stats-link{text-align:center;margin-top:14px;font-size:13px;}
  .stats-loading{text-align:center;font-family:var(--mono);font-size:12px;color:var(--ink-soft);padding:60px 0;}
  .stats-total{font-family:var(--display);font-weight:600;font-size:28px;text-align:center;margin:4px 0 32px;}
  .stats-round-row{display:flex;justify-content:space-between;gap:10px;padding:9px 11px;border:1px solid var(--line);
    border-radius:var(--radius);font-size:13px;margin-bottom:6px;}
  .stats-round-row .pick{text-align:right;color:var(--ink-soft);white-space:nowrap;font-family:var(--mono);font-size:11px;}
  .stats-callout{background:var(--accent-soft);border-radius:var(--radius);padding:14px 16px;font-size:13px;margin-bottom:28px;}
  footer{font-family:var(--mono);font-size:10px;letter-spacing:0.05em;text-transform:uppercase;
    color:var(--ink-soft);text-align:center;padding-top:40px;}
</style>
</head>
<body>

</div>
<script>

  { note:"Amber",            hint:"golden, resinous, glowing",        fam:"softoriental",   grp:"oriental", gen:"fem" },
  { note:"Frankincense",     hint:"cool smoke, church air",           fam:"softoriental",   grp:"oriental", gen:"uni" },
  { note:"Myrrh",            hint:"bitter resin, dark and dry",       fam:"softoriental",   grp:"oriental", gen:"masc" },

  { note:"Vanilla",          hint:"sweet, edible, comforting",        fam:"oriental",       grp:"oriental", gen:"fem" },
  { note:"Tonka Bean",       hint:"almond, hay, warm dessert",        fam:"oriental",       grp:"oriental", gen:"uni" },
  { note:"Labdanum",         hint:"sticky, leathery, honeyed resin",  fam:"oriental",       grp:"oriental", gen:"masc" },

  { note:"Sandalwood Cream", hint:"soft milky wood",                  fam:"woodyoriental",  grp:"oriental", gen:"fem" },
  { note:"Patchouli",        hint:"earthy, damp, a little dirty",     fam:"woodyoriental",  grp:"oriental", gen:"uni" },
  { note:"Oud",              hint:"dense, animalic, expensive",       fam:"woodyoriental",  grp:"oriental", gen:"masc" },

  // --- WOODY group ---
  { note:"Cashmere Wood",    hint:"blurred, soft, sweater-like",      fam:"woods",          grp:"woody",    gen:"fem" },
  { note:"Cedarwood",        hint:"pencil shavings, dry and clean",   fam:"woods",          grp:"woody",    gen:"uni" },
  { note:"Vetiver",          hint:"rooty, smoky, grassy",             fam:"woods",          grp:"woody",    gen:"masc" },

  { note:"Mossy Amber",      hint:"warm damp bark",                   fam:"mossywoods",     grp:"woody",    gen:"fem" },
  { note:"Fern",             hint:"cool green shade, barbershop",     fam:"mossywoods",     grp:"woody",    gen:"uni" },
  { note:"Oakmoss",          hint:"forest floor after rain",          fam:"mossywoods",     grp:"woody",    gen:"masc" },

  { note:"Suede",            hint:"soft dry hide, powdery",           fam:"drywoods",       grp:"woody",    gen:"fem" },
  { note:"Cedar Smoke",      hint:"a fire that has gone out",         fam:"drywoods",       grp:"woody",    gen:"uni" },
  { note:"Leather",          hint:"tannin, jacket, saddle",           fam:"drywoods",       grp:"woody",    gen:"masc" },

  // --- FRESH group ---
  { note:"Chamomile",        hint:"warm herbal tea, soothing",        fam:"aromatic",       grp:"fresh",    gen:"fem" },
  { note:"Rosemary & Sage",  hint:"sharp kitchen herbs",              fam:"aromatic",       grp:"fresh",    gen:"uni" },
  { note:"Lavender",         hint:"clean, camphorous, classic",       fam:"aromatic",       grp:"fresh",    gen:"masc" },

  { note:"Mandarin",         hint:"sweet, round, sunny",              fam:"citrus",         grp:"fresh",    gen:"fem" },
  { note:"Lemon Zest",       hint:"bright, sharp, just-peeled",       fam:"citrus",         grp:"fresh",    gen:"uni" },
  { note:"Bergamot",         hint:"bitter citrus, earl grey",         fam:"citrus",         grp:"fresh",    gen:"masc" },

  { note:"Water Lily",       hint:"cool petals on a pond",            fam:"water",          grp:"fresh",    gen:"fem" },
  { note:"Rain on Stone",    hint:"wet pavement, ozone",              fam:"water",          grp:"fresh",    gen:"uni" },
  { note:"Sea Salt",         hint:"cold spray, mineral air",          fam:"water",          grp:"fresh",    gen:"masc" },

  { note:"Green Tea",        hint:"pale, bitter, calm",               fam:"green",          grp:"fresh",    gen:"fem" },
  { note:"Cut Grass",        hint:"sap, summer lawns",                fam:"green",          grp:"fresh",    gen:"uni" },
  { note:"Galbanum",         hint:"fierce green, snapped stems",      fam:"green",          grp:"fresh",    gen:"masc" },

  { note:"Peach Skin",       hint:"fuzzy, nectarous, ripe",           fam:"fruity",         grp:"fresh",    gen:"fem" },
  { note:"Blackcurrant",     hint:"tart, dark, slightly sour",        fam:"fruity",         grp:"fresh",    gen:"uni" },
  { note:"Fig",              hint:"milky, green, sun-warmed",         fam:"fruity",         grp:"fresh",    gen:"masc" },
];

const FAMILY_LABEL = {
  floral:"Floral", softfloral:"Soft Floral", floraloriental:"Floral Oriental",
  softoriental:"Soft Oriental", oriental:"Oriental", woodyoriental:"Woody Oriental",
  woods:"Woods", mossywoods:"Mossy Woods", drywoods:"Dry Woods",
  aromatic:"Aromatic", citrus:"Citrus", water:"Water", green:"Green", fruity:"Fruity",
};
const GROUP_LABEL = { floral:"Floral", oriental:"Oriental", woody:"Woody", fresh:"Fresh" };
const GROUP_COLOR = { floral:"#E8467C", oriental:"#A8322F", woody:"#8A7A46", fresh:"#3E8FA8" };
const GENDER_LABEL = { fem:"feminine", uni:"unisex", masc:"masculine" };

const FAMILY_COPY = {
  floral:"You go straight for flowers as flowers — rose, peony, geranium, no apology and no disguise. It's the most classic thing you can wear and you know it.",
  softfloral:"You like flowers blurred rather than sharp: powder, musk, the soft focus of an old photograph. Understated, close to the skin, a little nostalgic.",
  floraloriental:"You want flowers with heat behind them — orange blossom over spice. Sweet but not innocent, and it carries across a room.",
  softoriental:"Incense and amber. You're drawn to resin and smoke, to scents that feel ceremonial rather than pretty.",
  oriental:"Rich, warm and unabashedly sweet — vanilla, tonka, resin. This is comfort worn on the skin, and it lingers for hours.",
  woodyoriental:"Sandalwood, patchouli, oud. Deep and a bit animal. You like a scent with weight and a slightly dirty edge.",
  woods:"Dry, clean wood — cedar and vetiver. Composed, grown-up, quietly expensive. Never trying too hard.",
  mossywoods:"Oakmoss and damp bark: the smell of a forest floor. Green but shadowed, and rather old-fashioned in the best way.",
  drywoods:"Leather, suede, cold smoke. You like scents with texture and a little bite — the opposite of fresh.",
  aromatic:"Lavender, herbs, clean edges. Crisp and slightly medicinal, the most reliably fresh-smelling thing on the wheel.",
  citrus:"Bright, sharp, awake. Citrus is the first thing anyone smells and the first to go — you like the burst more than the lingering.",
  water:"Salt, rain, ozone. Cool and open and a bit weightless, more atmosphere than substance.",
  green:"Cut grass, snapped stems, galbanum. Sharp and vegetal — the smell of things growing rather than things blooming.",
  fruity:"Peach, blackcurrant, fig. Juicy and a little tart, playful without being childish.",
};
const GROUP_COPY = {
  floral:"Your taste sits in the floral half of the wheel.",
  oriental:"Your taste sits in the oriental half of the wheel — warm, resinous, and rich.",
  woody:"Your taste sits in the woody half of the wheel — dry, grounded, textural.",
  fresh:"Your taste sits in the fresh half of the wheel — bright, cool and airy.",
};
const GENDER_COPY = {
  fem:"Your picks lean towards notes traditionally marketed as feminine, though the wheel doesn't care and neither should you.",
  masc:"Your picks lean towards notes traditionally marketed as masculine — which in practice mostly means drier and less sweet.",
  uni:"Your picks sit squarely in unisex territory, which is where most of the interesting perfumery has been happening anyway.",
};
// Gourmand isn't a wheel family — it's a modern label for the edible corner
// of Oriental. Only used when someone's top picks really are the sweet ones.
const GOURMAND_NOTES = ["Vanilla","Tonka Bean","Peach Skin","Amber"];

function computeLeans(records){
  const famPicks = {}, famSize = {}, genPicks = {}, genSize = {};
  records.forEach(r => {
    famSize[r.fam] = (famSize[r.fam]||0) + 1;
    genSize[r.gen] = (genSize[r.gen]||0) + 1;
    if (!r.played) return;
    famPicks[r.fam] = (famPicks[r.fam]||0) + r.pickCount;
    genPicks[r.gen] = (genPicks[r.gen]||0) + r.pickCount;
  });
  const famTotal = Object.values(famPicks).reduce((s,v)=>s+v,0) || 1;
  const families = Object.keys(famSize)
    .map(f => ({ key:f, count:famPicks[f]||0, pct: Math.round((famPicks[f]||0)/famTotal*100) }))
    .sort((a,b) => b.count - a.count || a.key.localeCompare(b.key));

  // Group score is the AVERAGE of its families' scores, not the sum. The wheel
  // gives Fresh five families and the others three, so summing would report
  // "Fresh" for almost everyone regardless of what they actually picked.
  const GRP_OF = {};
  records.forEach(r => { GRP_OF[r.fam] = r.grp; });
  const grpSum = {}, grpFams = {};
  Object.keys(famSize).forEach(f => {
    const g = GRP_OF[f];
    grpSum[g] = (grpSum[g]||0) + (famPicks[f]||0);
    grpFams[g] = (grpFams[g]||0) + 1;
  });
  const groupsRaw = Object.keys(grpSum).map(g => ({ key:g, avg: grpSum[g]/grpFams[g] }));
  const avgTotal = groupsRaw.reduce((s,g)=>s+g.avg,0) || 1;
  const groups = groupsRaw
    .map(g => ({ key:g.key, avg:g.avg, pct: Math.round(g.avg/avgTotal*100) }))
    .sort((a,b) => b.avg - a.avg || a.key.localeCompare(b.key));

  const genTotal = Object.values(genPicks).reduce((s,v)=>s+v,0) || 1;
  const genders = Object.keys(genSize)
    .map(g => ({ key:g, count:genPicks[g]||0, pct: Math.round((genPicks[g]||0)/genTotal*100) }))
    .sort((a,b) => b.count - a.count || a.key.localeCompare(b.key));

  return { families, groups, genders };
}

function isGourmand(ranking, records){
  const top5 = ranking.slice(0,5).map(i => records[i].note);
  return top5.filter(n => GOURMAND_NOTES.indexOf(n) !== -1).length >= 2;
}


const FAMILY_ROTATION = ["floral","softoriental","woods","citrus","softfloral","oriental",
  "mossywoods","water","floraloriental","woodyoriental","drywoods","green","aromatic","fruity"];

function buildOpeningPairs(){
  const buckets = {};
  FAMILY_ROTATION.forEach(f => { buckets[f] = []; });
  NOTE_POOL.forEach((n,i) => buckets[n.fam].push(i));
  const order = [];
  let added = true;
  while (added){
    added = false;
    for (const fam of FAMILY_ROTATION){
      if (buckets[fam].length){ order.push(buckets[fam].shift()); added = true; }
    }
  }
  const pairs = [];
  for (let k = 0; k < order.length; k += 2) pairs.push([order[k], order[k+1]]);
  for (let k = 0; k < pairs.length - 1; k++){
    if (NOTE_POOL[pairs[k][0]].fam === NOTE_POOL[pairs[k][1]].fam){
      const t = pairs[k][1]; pairs[k][1] = pairs[k+1][1]; pairs[k+1][1] = t;
    }
  }
  return pairs;
}
const OPENING_PAIRS = buildOpeningPairs();
const LADDER_SIZES = [16, 8, 4, 2];
const TOTAL_BATTLES = OPENING_PAIRS.length + LADDER_SIZES.reduce((s,n)=>s+n/2,0);
const ROUND_NAMES = ["Opening round","Round of 16","Quarter-finals","Semi-finals","The final"];
const ELO_START = 1000, ELO_K = 32;

// Tie-breaking needs care. After the opening round every winner has beaten one
// untested note, so all 21 hold an identical rating and the cut to the best 16
// is decided purely by the tie-break. Breaking ties by position in the pool
// would hand those places to whichever families and genders happen to be listed
// first — the same fault that made blackletter vanish from Font Match. Ties are
// broken by taking one note from each family in turn, and the gender that goes
// first is rotated family by family, so neither dimension gets a head start.
const FAM_ORDER = i => FAMILY_ROTATION.indexOf(NOTE_POOL[i].fam);
const TIE_SLOT = (() => {
  const c = {}, slot = [];
  NOTE_POOL.forEach((n,i) => { c[n.fam] = c[n.fam] || 0; slot[i] = c[n.fam]++; });
  // shift each family's starting gender by its position in the rotation
  return NOTE_POOL.map((n,i) => (slot[i] + FAM_ORDER(i)) % 3);
})();

function rankByRating(rating, played){
  const seen=[], unseen=[];
  for (let i=0;i<NOTE_POOL.length;i++) (played[i]?seen:unseen).push(i);
  seen.sort((a,b)=> rating[b]-rating[a] || TIE_SLOT[a]-TIE_SLOT[b] || FAM_ORDER(a)-FAM_ORDER(b) || a-b);
  return seen.concat(unseen);
}
function scheduleFor(battleNo, rating, played){
  if (battleNo <= OPENING_PAIRS.length){
    const p = OPENING_PAIRS[battleNo-1];
    return { left:p[0], right:p[1], round:0 };
  }
  let n = battleNo - OPENING_PAIRS.length;
  for (let r=0;r<LADDER_SIZES.length;r++){
    const size = LADDER_SIZES[r], count = size/2;
    if (n <= count){
      const pool = rankByRating(rating, played).slice(0,size);
      return { left:pool[n-1], right:pool[size-n], round:r+1 };
    }
    n -= count;
  }
  return null;
}
function simulateRun(outcomes){
  const rating=new Array(NOTE_POOL.length).fill(ELO_START);
  const wins=new Array(NOTE_POOL.length).fill(0);
  const losses=new Array(NOTE_POOL.length).fill(0);
  const pickCount=new Array(NOTE_POOL.length).fill(0);
  const played=new Array(NOTE_POOL.length).fill(false);
  function applyElo(a,b){
    const expA = 1/(1+Math.pow(10,(rating[b]-rating[a])/400));
    rating[a] += ELO_K*(1-expA); rating[b] += ELO_K*(0-(1-expA));
  }
  let championIndex=null;
  for (let b=1;b<=TOTAL_BATTLES;b++){
    const sched=scheduleFor(b,rating,played);
    const code=outcomes[b-1];
    if (code===undefined) return {rating,wins,losses,pickCount,played,championIndex:null,
      nextBattle:b,nextSchedule:sched,ranking:rankByRating(rating,played),complete:false};
    const w = code==="x"?sched.right:sched.left, l = code==="x"?sched.left:sched.right;
    played[sched.left]=true; played[sched.right]=true;
    applyElo(w,l); wins[w]+=1; losses[l]+=1; pickCount[w]+=1; championIndex=w;
  }
  return {rating,wins,losses,pickCount,played,championIndex,nextBattle:null,nextSchedule:null,
    ranking:rankByRating(rating,played),complete:true};
}
function buildRecords(r){
  return NOTE_POOL.map((n,i)=>({note:n.note,hint:n.hint,fam:n.fam,grp:n.grp,gen:n.gen,
    wins:r.wins[i],losses:r.losses[i],pickCount:r.pickCount[i],rating:r.rating[i],played:r.played[i]}));
}
function computeRanking(records){
  return records.map((r,i)=>({i,rating:r.rating,played:r.played})).filter(r=>r.played)
    .sort((a,b)=>b.rating-a.rating||a.i-b.i).map(r=>r.i);
}
const COMPAT_TOP=10;
function computeCompatibility(mine,theirs){
  const A=computeRanking(mine),B=computeRanking(theirs);
  if(!A.length||!B.length) return null;
  const pa={},pb={}; A.forEach((x,p)=>pa[x]=p+1); B.forEach((x,p)=>pb[x]=p+1);
  const pool=new Set([...A.slice(0,COMPAT_TOP),...B.slice(0,COMPAT_TOP)]);
  let ws=0,wt=0;
  pool.forEach(i=>{
    const ra=pa[i]===undefined?A.length+1:pa[i], rb=pb[i]===undefined?B.length+1:pb[i];
    const sim=Math.max(0,1-Math.abs(ra-rb)/COMPAT_TOP);
    const w=(COMPAT_TOP*2+2)-Math.min(ra,rb);
    ws+=sim*w; wt+=w;
  });
  return {pct:Math.round(ws/wt*100)};
}

function renderRuler(currentBattle){
  const blocks = [OPENING_PAIRS.length, ...LADDER_SIZES.map(n => n/2)];
  let seen = 0;
  return `<div class="ruler">` + blocks.map(count => {
    const ticks = Array.from({length:count}, (_,k) => {
      const n = seen + k + 1;
      let cls = "tick";
      if (n < currentBattle) cls += " done";
      else if (n === currentBattle) cls += " current";
      return `<div class="${cls}"></div>`;
    }).join("");
    seen += count;
    return `<div class="rgroup" style="--w:${count}">${ticks}</div>`;
  }).join("") + `</div>`;
}

function submitResult(answers, result){
  const leans = computeLeans(answers);
  const notes = answers.filter(a => a.played).map(a => ({
    key:a.note, wins:a.wins, losses:a.losses,
    isChampion: a.note === answers[result.championIndex].note,
  }));
  try {
    fetch("/api/submit", {
      method:"POST", headers:{ "content-type":"application/json" },
      body: JSON.stringify({
        quiz:"scent", fonts:notes,
        championKey: answers[result.championIndex].note,
        category: leans.families[0].key,
      }),
    }).catch(() => {});
  } catch (e) {}
}

      <div class="wheel-label">${escapeHtml(label)}</div>
      <div class="wheel-track"><div class="wheel-fill" style="width:${pct}%;background:${GROUP_COLOR[grp] || "#999"}"></div></div>
      <div class="wheel-pct">${pct}%</div></div>`;
  }).join("");
  const favRows = favourites.slice(0,8).map(f => `
    <div class="stats-round-row"><div>${escapeHtml(f.key)}</div><div class="pick">${f.pct}% picked it</div></div>`).join("");

  app.innerHTML = `
    <div class="result-kicker">Group results</div>
    <div class="stats-total">${totalPlayers} ${totalPlayers === 1 ? "person has" : "people have"} taken the test</div>
    ${totalCat ? `<div class="stats-section"><div class="stats-heading">Favourite families so far</div><div class="wheel-bars">${famBars}</div></div>` : ""}
    ${favourites.length ? `<div class="stats-callout"><b>Most common favourite:</b> ${escapeHtml(favourites[0].key)}, the top note for ${favourites[0].champs} ${favourites[0].champs === 1 ? "person" : "people"}.</div>` : ""}
    ${favRows ? `<div class="stats-section"><div class="stats-heading">How often each note won outright</div>${favRows}</div>` : ""}
    <div class="btn-row"><button class="cta ghost" id="back-btn">Back</button><a class="cta ghost" href="/" style="text-decoration:none;">More quizzes</a></div>`;
  document.getElementById("back-btn").addEventListener("click", () => {
    state.mode = challenger ? "intro-challenge" : "landing"; render();
  });
}

function wireShare(outcomes){
  const nameInput = document.getElementById("name-input");
  const shareInput = document.getElementById("share-input");
  function refresh(){ myName = nameInput.value.trim(); shareInput.value = buildShareLink(outcomes, myName); }
  refresh();
  nameInput.addEventListener("input", refresh);
  document.getElementById("copy-btn").addEventListener("click", async () => {
    const note = document.getElementById("copy-note");
    try { await navigator.clipboard.writeText(shareInput.value); note.textContent = "Link copied."; }
    catch (e) { shareInput.select(); note.textContent = "Press Ctrl/Cmd+C to copy."; }
    setTimeout(() => { note.textContent = ""; }, 2500);
  });
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}

render();
</script>
</body>
</html>
