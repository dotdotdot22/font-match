<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Font Match — do your typefaces agree?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500;600&family=Playfair+Display:wght@700&family=DM+Sans:wght@700&family=Space+Mono:wght@700&family=Cormorant+Garamond:wght@600&family=Bebas+Neue&family=Libre+Baskerville:wght@700&family=Caveat:wght@700&family=Oswald:wght@600&family=IBM+Plex+Mono:wght@600&family=Lora:wght@600&family=Alfa+Slab+One&family=Nunito+Sans:wght@700&family=Dancing+Script:wght@700&family=Barlow:wght@700&family=Big+Shoulders+Display:wght@700&family=Spectral:wght@600&family=UnifrakturMaguntia&family=Pirata+One&family=Great+Vibes&family=Parisienne&family=Tangerine:wght@700&family=Satisfy&family=Alex+Brush&family=Yellowtail&family=Rock+Salt&family=Monoton&family=Bangers&family=Lobster&family=Orbitron:wght@700&family=Shrikhand&family=Unbounded:wght@700&family=Chewy&family=Comfortaa:wght@700&family=Bodoni+Moda:wght@700&family=Silkscreen:wght@700&family=Cutive+Mono&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6F6F3;
    --paper-shade:#ECEBE5;
    --ink:#16151A;
    --ink-soft:#5B5A56;
    --line:#D9D7CF;
    --accent:#2A4DE0;
    --accent-soft:#E8ECFC;
    --match:#E63462;
    --match-soft:#FCE9EE;
    --radius:4px;
    --display: 'Fraunces', serif;
    --body: 'Space Grotesk', sans-serif;
    --mono: 'JetBrains Mono', monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--body);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  a{color:var(--accent);}
  button{font-family:inherit;}
  button:focus-visible, a:focus-visible, input:focus-visible{
    outline:2px solid var(--accent);
    outline-offset:3px;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation:none !important; transition:none !important;}
  }

  .frame{
    max-width:720px;
    margin:0 auto;
    padding:28px 20px 60px;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }

  .topline{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--ink-soft);
    padding-bottom:16px;
    border-bottom:1px solid var(--line);
    margin-bottom:36px;
  }
  .topline .mark{position:relative; width:14px; height:14px;}
  .topline .mark::before,.topline .mark::after{
    content:"";
    position:absolute;
    background:var(--ink-soft);
  }
  .topline .mark::before{ left:50%; top:0; width:1px; height:100%; transform:translateX(-50%);}
  .topline .mark::after{ top:50%; left:0; height:1px; width:100%; transform:translateY(-50%);}

  #app{flex:1; display:flex; flex-direction:column; justify-content:center;}

  /* ---------- Landing ---------- */
  .landing h1{
    font-family:var(--display);
    font-weight:600;
    font-size:clamp(40px,9vw,64px);
    line-height:1.02;
    margin:0 0 20px;
    letter-spacing:-0.01em;
  }
  .landing p.lede{
    font-size:17px;
    line-height:1.55;
    color:var(--ink-soft);
    max-width:46ch;
    margin:0 0 32px;
  }
  .cta{
    font-family:var(--body);
    font-weight:600;
    font-size:15px;
    background:var(--ink);
    color:var(--paper);
    border:none;
    padding:15px 26px;
    border-radius:var(--radius);
    cursor:pointer;
    letter-spacing:0.01em;
    transition:transform .15s ease, background .15s ease;
  }
  .cta:hover{background:var(--accent);}
  .cta:active{transform:translateY(1px);}
  .cta.ghost{
    background:transparent;
    color:var(--ink);
    border:1px solid var(--ink);
  }
  .cta.ghost:hover{background:var(--ink); color:var(--paper);}

  .challenge-banner{
    font-family:var(--mono);
    font-size:12px;
    letter-spacing:0.05em;
    text-transform:uppercase;
    color:var(--accent);
    background:var(--accent-soft);
    display:inline-block;
    padding:6px 10px;
    border-radius:var(--radius);
    margin-bottom:18px;
  }

  /* ---------- Quiz ---------- */
  .ruler{
    display:flex;
    gap:3px;
    margin-bottom:28px;
    flex-wrap:wrap;
  }
  .tick{
    flex:1;
    min-width:6px;
    height:4px;
    background:var(--line);
    border-radius:2px;
    transition:background .2s ease;
  }
  .tick.done{background:var(--ink);}
  .tick.current{background:var(--accent);}

  .round-label{
    font-family:var(--mono);
    font-size:12px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-bottom:8px;
  }
  .round-word{
    font-family:var(--mono);
    font-size:13px;
    color:var(--ink-soft);
    margin-bottom:22px;
  }
  .round-word b{color:var(--ink); font-weight:600;}

  .specimens{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
  }
  @media (max-width:560px){
    .specimens{grid-template-columns:1fr;}
  }
  .specimen{
    background:var(--paper-shade);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:26px 18px 16px;
    cursor:pointer;
    text-align:center;
    position:relative;
    min-height:180px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    transition:border-color .15s ease, background .15s ease;
  }
  .specimen:hover{border-color:var(--ink);}
  .specimen.chosen{
    background:var(--accent-soft);
    border-color:var(--accent);
  }
  .specimen .word{
    word-break:break-word;
    line-height:1.05;
  }
  .specimen .pt{
    font-family:var(--mono);
    font-size:10px;
    color:var(--ink-soft);
    letter-spacing:0.06em;
    margin-top:14px;
  }

  .specimen-badge{
    font-family:var(--mono);
    font-size:9px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-bottom:10px;
  }
  .specimen.chosen .specimen-badge{color:var(--accent);}

  .neutral-btn{
    display:block;
    margin:16px auto 0;
    font-family:var(--body);
    font-size:13px;
    color:var(--ink-soft);
    background:transparent;
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:10px 18px;
    cursor:pointer;
    transition:border-color .15s ease, color .15s ease;
  }
  .neutral-btn:hover{border-color:var(--ink); color:var(--ink);}

  .champion-showcase{
    text-align:center;
    margin-bottom:20px;
  }
  .champion-label{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-bottom:10px;
  }
  .champion-word{
    font-size:52px;
    line-height:1.05;
    word-break:break-word;
  }
  .champion-name{
    font-family:var(--mono);
    font-size:12px;
    color:var(--ink-soft);
    margin-top:10px;
  }

  .dominance-list{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-bottom:4px;
  }
  .dominance-row{
    display:flex;
    align-items:center;
    gap:12px;
    padding:10px 12px;
    border:1px solid var(--line);
    border-radius:var(--radius);
  }
  .dominance-row.champion{background:var(--accent-soft); border-color:var(--accent);}
  .dominance-rank{
    font-family:var(--mono);
    font-size:13px;
    width:28px;
    flex-shrink:0;
    color:var(--ink-soft);
    text-align:center;
  }
  .dominance-row.champion .dominance-rank{font-size:16px;}
  .dominance-name{flex:1; font-size:15px; color:var(--ink); overflow-wrap:anywhere;}
  .dominance-wins{
    font-family:var(--mono);
    font-size:11px;
    color:var(--ink-soft);
    white-space:nowrap;
  }

  .personality-text{
    font-size:14px;
    line-height:1.55;
    color:var(--ink-soft);
    margin:0;
  }

  /* ---------- Results (shared) ---------- */
  .result-kicker{
    font-family:var(--mono);
    font-size:12px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-bottom:6px;
    text-align:center;
  }
  .result-sub{
    font-size:16px;
    color:var(--ink-soft);
    margin-bottom:28px;
    text-align:center;
  }
  .result-sub b{color:var(--ink);}

  .profile-tag{
    font-family:var(--display);
    font-style:italic;
    font-size:22px;
    margin:0 0 28px;
  }

  /* ---------- Match layout: them | heart | you ---------- */
  .match-layout{
    display:grid;
    grid-template-columns:1fr 128px 1fr;
    gap:16px;
    align-items:stretch;
    margin-bottom:12px;
  }
  .match-col{
    display:flex;
    flex-direction:column;
    gap:6px;
    min-width:0;
  }
  .match-col .col-label{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-bottom:2px;
  }
  .match-col.them .col-label{text-align:left;}
  .match-col.you .col-label{text-align:right;}

  .match-entry{
    padding:9px 11px;
    border-radius:var(--radius);
    border:1px solid var(--line);
    font-size:12px;
    line-height:1.25;
    overflow-wrap:anywhere;
  }
  .match-col.them .match-entry{text-align:left;}
  .match-col.you .match-entry{text-align:right;}
  .match-entry.match{background:var(--match-soft); border-color:var(--match); color:var(--match); font-weight:600;}
  .match-entry .w{
    display:block;
    font-family:var(--mono);
    font-size:9px;
    letter-spacing:0.05em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-bottom:2px;
  }
  .match-entry.match .w{color:var(--match);}

  .match-center{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:12px 0;
  }
  .heart-wrap{
    position:relative;
    width:88px;
    height:88px;
    transform:scale(0.15);
    opacity:0;
    transition:transform .7s cubic-bezier(.32,1.6,.5,1), opacity .5s ease;
  }
  .heart-wrap.grown{
    transform:scale(var(--heart-scale, 1));
    opacity:1;
  }
  .heart-svg{position:absolute; inset:0; width:100%; height:100%;}
  .heart-outline path{fill:none; stroke:var(--match); stroke-width:1.1;}
  .heart-fill path{fill:var(--match); transition:opacity .8s ease .2s;}
  .match-pct{
    margin-top:14px;
    font-family:var(--display);
    font-weight:600;
    font-size:36px;
    color:var(--ink);
    line-height:1;
  }
  .match-statement{
    margin-top:10px;
    font-size:12.5px;
    line-height:1.4;
    color:var(--ink-soft);
    max-width:20ch;
  }

  @media (max-width:640px){
    .match-layout{grid-template-columns:1fr;}
    .match-center{order:-1; padding-bottom:20px;}
    .match-col.you .col-label,
    .match-col.you .match-entry{text-align:left;}
  }

  .name-box{margin-bottom:12px;}
  .name-box input{
    width:100%;
    font-family:var(--body);
    font-size:14px;
    padding:12px 14px;
    border:1px solid var(--line);
    border-radius:var(--radius);
    background:var(--paper);
    color:var(--ink);
  }
  .name-box input::placeholder{color:var(--ink-soft);}

  .share-box{
    display:flex;
    gap:8px;
    margin-bottom:14px;
  }
  .share-box input{
    flex:1;
    font-family:var(--mono);
    font-size:12px;
    padding:12px 12px;
    border:1px solid var(--line);
    border-radius:var(--radius);
    background:var(--paper-shade);
    color:var(--ink-soft);
  }
  .copy-note{
    font-family:var(--mono);
    font-size:11px;
    color:var(--accent);
    height:16px;
    margin-bottom:20px;
  }

  .btn-row{display:flex; gap:12px; flex-wrap:wrap; justify-content:center; margin-top:6px;}

  .affiliate-line{
    margin-top:36px;
    padding-top:18px;
    border-top:1px solid var(--line);
    font-size:13px;
    color:var(--ink-soft);
    text-align:center;
  }

  .stats-link{
    text-align:center;
    margin-top:14px;
    font-size:13px;
  }

  /* ---------- Group stats page ---------- */
  .stats-loading{
    text-align:center;
    font-family:var(--mono);
    font-size:12px;
    color:var(--ink-soft);
    padding:60px 0;
  }
  .stats-total{
    font-family:var(--display);
    font-weight:600;
    font-size:28px;
    text-align:center;
    margin:4px 0 32px;
  }
  .stats-section{margin-bottom:28px;}
  .stats-heading{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-bottom:12px;
  }
  .stats-bar-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:9px;
    font-size:13px;
  }
  .stats-bar-label{width:150px; flex-shrink:0;}
  .stats-bar-track{
    flex:1;
    height:8px;
    background:var(--paper-shade);
    border-radius:4px;
    overflow:hidden;
  }
  .stats-bar-fill{height:100%; background:var(--accent); border-radius:4px;}
  .stats-bar-pct{width:38px; text-align:right; font-family:var(--mono); font-size:11px; color:var(--ink-soft);}
  .stats-callout{
    background:var(--accent-soft);
    border-radius:var(--radius);
    padding:14px 16px;
    font-size:13px;
    margin-bottom:28px;
  }
  .stats-round-row{
    display:flex;
    justify-content:space-between;
    gap:10px;
    padding:9px 11px;
    border:1px solid var(--line);
    border-radius:var(--radius);
    font-size:12px;
    margin-bottom:6px;
  }
  .stats-round-row .w{font-family:var(--mono); color:var(--ink-soft); text-transform:uppercase; font-size:10px;}
  .stats-round-row .pick{text-align:right; color:var(--ink-soft);}

  footer{
    font-family:var(--mono);
    font-size:10px;
    letter-spacing:0.05em;
    text-transform:uppercase;
    color:var(--ink-soft);
    text-align:center;
    padding-top:40px;
  }
</style>
</head>
<body>
<div class="frame">
  <div class="topline">
    <span>Font Match — Tournament</span>
    <span class="mark" aria-hidden="true"></span>
  </div>
  <div id="app"></div>
  <footer>One bracket. One favorite. See who agrees with you.</footer>
</div>

<script>
/* ---------------------------------------------------------
   FONT POOL
   16 fonts, each tied to a word, drawn from the original 22
   pairs (kept the same visual "specimen" idea: both fonts in
   a battle render the same word). Fixed order — every visitor
   sees the same sequence, which is what makes the share link
   and the group stats possible.
--------------------------------------------------------- */
const FONT_POOL = [
  { word:"Wanderlust", font:"'Playfair Display'", size:44, cat:"serif" },
  { word:"Wanderlust", font:"'DM Sans'", size:38, cat:"sans" },
  { word:"Nocturne", font:"'Space Mono'", size:34, cat:"mono" },
  { word:"Nocturne", font:"'Cormorant Garamond'", size:46, cat:"serif" },
  { word:"QUICKSILVER", font:"'Bebas Neue'", size:40, cat:"display" },
  { word:"QUICKSILVER", font:"'Libre Baskerville'", size:30, cat:"serif" },
  { word:"Marigold", font:"'Caveat'", size:50, cat:"script" },
  { word:"Marigold", font:"'Oswald'", size:36, cat:"sans" },
  { word:"Paradox", font:"'IBM Plex Mono'", size:32, cat:"mono" },
  { word:"Paradox", font:"'Lora'", size:38, cat:"serif" },
  { word:"Ember", font:"'Alfa Slab One'", size:32, cat:"slab" },
  { word:"Ember", font:"'Nunito Sans'", size:34, cat:"sans" },
  { word:"Halcyon", font:"'Dancing Script'", size:46, cat:"script" },
  { word:"Halcyon", font:"'Barlow'", size:36, cat:"sans" },
  { word:"Cobalt", font:"'Big Shoulders Display'", size:36, cat:"display" },
  { word:"Cobalt", font:"'Spectral'", size:38, cat:"serif" },
  { word:"Vanguard", font:"'UnifrakturMaguntia'", size:36, cat:"blackletter" },
  { word:"Wraith", font:"'Pirata One'", size:34, cat:"blackletter" },
  { word:"Cherish", font:"'Great Vibes'", size:46, cat:"script" },
  { word:"Reverie", font:"'Parisienne'", size:44, cat:"script" },
  { word:"Elysian", font:"'Tangerine'", size:54, cat:"script" },
  { word:"Breezy", font:"'Satisfy'", size:40, cat:"script" },
  { word:"Velour", font:"'Alex Brush'", size:44, cat:"script" },
  { word:"Sunbeam", font:"'Yellowtail'", size:38, cat:"script" },
  { word:"Rustic", font:"'Rock Salt'", size:34, cat:"script" },
  { word:"Neon", font:"'Monoton'", size:30, cat:"display" },
  { word:"Kaboom", font:"'Bangers'", size:38, cat:"display" },
  { word:"Zephyr", font:"'Lobster'", size:36, cat:"display" },
  { word:"Vortex", font:"'Orbitron'", size:32, cat:"display" },
  { word:"Carnival", font:"'Shrikhand'", size:34, cat:"display" },
  { word:"Fracture", font:"'Unbounded'", size:30, cat:"display" },
  { word:"Bubblegum", font:"'Chewy'", size:34, cat:"display" },
  { word:"Cloudy", font:"'Comfortaa'", size:34, cat:"sans" },
  { word:"Vogue", font:"'Bodoni Moda'", size:40, cat:"serif" },
  { word:"Pixel", font:"'Silkscreen'", size:28, cat:"mono" },
  { word:"Vintage", font:"'Cutive Mono'", size:32, cat:"mono" },
];

const TAG_LABEL = {
  serif:"Classic & Serif-Leaning",
  sans:"Clean & Modern",
  display:"Bold & Maximalist",
  script:"Playful & Expressive",
  mono:"Technical & Precise",
  slab:"Sturdy & Slab-Serif",
  blackletter:"Dramatic & Gothic",
};

const CATEGORY_PHRASE = {
  serif:"serif type",
  sans:"clean sans-serif type",
  display:"bold display type",
  script:"playful script type",
  mono:"technical monospace type",
  slab:"sturdy slab type",
  blackletter:"dramatic blackletter type",
};

const PERSONALITY_COPY = {
  serif: "You're drawn to serif type — classic, dependable, built to be taken seriously. You probably value clear communication and don't go looking for unnecessary flash.",
  sans: "You're drawn to clean sans-serif type — modern, minimal, no clutter. You likely value simplicity and directness over decoration.",
  display: "You're drawn to bold display type — big, loud, impossible to ignore. You're probably artsy and a little eccentric, and you don't mind standing out.",
  script: "You're drawn to script and cursive type — flowing, expressive, personal. You likely lead with feeling over rigid structure.",
  mono: "You're drawn to monospace type — precise, technical, orderly. You probably think in systems and like things lined up just right.",
  slab: "You're drawn to slab serif type — sturdy, confident, no-nonsense. You value reliability and don't waste time on subtlety.",
  blackletter: "You're drawn to blackletter and gothic type — dramatic, intense, larger than life. You've got a flair for the theatrical.",
};

// Which type category this person actually preferred, weighted by how
// decisively they won with fonts in that category — not just which
// category the outright champion happened to belong to.
function computeDominantCategory(records){
  const totals = {};
  records.forEach(r => {
    if (r.status === "neutral") return;
    totals[r.cat] = (totals[r.cat] || 0) + r.wins;
  });
  let best = null, bestVal = -1;
  Object.keys(totals).forEach(cat => {
    if (totals[cat] > bestVal) { best = cat; bestVal = totals[cat]; }
  });
  return best;
}

const HEART_PATH = "M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z";

/* ---------------------------------------------------------
   TOURNAMENT ENGINE
   Font 0 starts as champion. Each font after it, in order,
   challenges the current champion. Winner stays on. A neutral
   pick leaves the champion in place and drops the challenger
   out of that person's ranking entirely (no opinion recorded).

   "outcomes" is an array of single-character codes, one per
   battle: 'c' = champion kept it, 'x' = challenger won,
   'n' = neutral. Replaying the same outcomes against the same
   FONT_POOL always reproduces the same result — that's what
   makes the compact share link possible.
--------------------------------------------------------- */
function simulateRun(outcomes){
  const wins = new Array(FONT_POOL.length).fill(0);
  const status = new Array(FONT_POOL.length).fill("pending");
  const eliminatedAt = new Array(FONT_POOL.length).fill(null);
  let championIndex = 0;

  const mainBattleCount = FONT_POOL.length - 1;
  const mainOutcomes = outcomes.slice(0, mainBattleCount);
  const finalOutcomes = outcomes.slice(mainBattleCount);

  mainOutcomes.forEach((code, idx) => {
    const battle = idx + 1;
    const challengerIndex = battle;
    if (code === "c") {
      wins[championIndex] += 1;
      status[challengerIndex] = "eliminated";
      eliminatedAt[challengerIndex] = battle;
    } else if (code === "x") {
      status[championIndex] = "eliminated";
      eliminatedAt[championIndex] = battle;
      championIndex = challengerIndex;
    } else {
      status[challengerIndex] = "neutral";
    }
  });

  // ---- Final round: the top 3 performers face off directly, so the
  // real favorite is confirmed head-to-head rather than just being
  // "whoever happened to be undefeated when the bracket ran out." ----
  function currentRanking(){
    const indices = [];
    for (let i = 0; i < FONT_POOL.length; i++) {
      if (status[i] !== "neutral") indices.push(i);
    }
    indices.sort((a, b) => {
      if (wins[b] !== wins[a]) return wins[b] - wins[a];
      const elimA = eliminatedAt[a] === null ? Infinity : eliminatedAt[a];
      const elimB = eliminatedAt[b] === null ? Infinity : eliminatedAt[b];
      return elimB - elimA;
    });
    return indices;
  }

  const finalists = currentRanking().slice(0, 3);

  if (finalists.length >= 2) {
    let finalBest = finalists[0];
    for (let step = 1; step < finalists.length; step++) {
      const finalChallenger = finalists[step];
      const code = finalOutcomes[step - 1];
      if (code === "c") {
        wins[finalBest] += 1;
        status[finalChallenger] = "eliminated";
        eliminatedAt[finalChallenger] = mainBattleCount + step;
      } else if (code === "x") {
        wins[finalChallenger] += 1;
        status[finalBest] = "eliminated";
        eliminatedAt[finalBest] = mainBattleCount + step;
        finalBest = finalChallenger;
      }
      // 'n', or the battle simply hasn't been played yet: leave things as
      // they stand and, if it hasn't been played yet, stop simulating.
      if (code === undefined) break;
    }
    championIndex = finalBest;
  }

  status[championIndex] = "champion";
  return { wins, status, eliminatedAt, championIndex, finalists };
}

function buildFontRecords(result){
  return FONT_POOL.map((f, i) => ({
    key: f.font,
    cat: f.cat,
    wins: result.wins[i],
    status: result.status[i],
    eliminatedAt: result.eliminatedAt[i],
  }));
}

// Best → worst, excluding anything marked neutral.
function computeRanking(records){
  return records
    .map((r, i) => ({
      i,
      wins: r.wins,
      elim: r.eliminatedAt === null ? Infinity : r.eliminatedAt,
      status: r.status,
    }))
    .filter(r => r.status !== "neutral")
    .sort((a, b) => b.wins - a.wins || b.elim - a.elim)
    .map(r => r.i);
}

// Weighted rank agreement over whatever fonts both people actually
// ranked (fonts either person marked neutral are left out of the
// comparison for both). Agreement on a highly-ranked font counts for
// much more than agreement further down the list.
function computeCompatibility(mine, theirs){
  const myRank = computeRanking(mine);
  const theirRank = computeRanking(theirs);
  const theirSet = new Set(theirRank);
  const common = myRank.filter(i => theirSet.has(i));
  const commonSet = new Set(common);
  const myCommon = myRank.filter(i => commonSet.has(i));
  const theirCommon = theirRank.filter(i => commonSet.has(i));
  const M = myCommon.length;
  if (M === 0) return null;

  const myPos = {}, theirPos = {};
  myCommon.forEach((idx, pos) => { myPos[idx] = pos + 1; });
  theirCommon.forEach((idx, pos) => { theirPos[idx] = pos + 1; });

  let weightedSum = 0, weightTotal = 0;
  commonSet.forEach(idx => {
    const rA = myPos[idx], rB = theirPos[idx];
    const diff = Math.abs(rA - rB);
    const similarity = M > 1 ? 1 - diff / (M - 1) : 1;
    const weight = (M + 1) - Math.min(rA, rB);
    weightedSum += similarity * weight;
    weightTotal += weight;
  });

  return { pct: Math.round((weightedSum / weightTotal) * 100), M };
}

--------------------------------------------------------- */
const params = new URLSearchParams(location.search);
const incomingVs = params.get("vs");
const incomingName = params.get("who") || "";

let challenger = null;
if (incomingVs && /^[cxn]+$/.test(incomingVs)) {
  const mainBattles = FONT_POOL.length - 1;
  if (incomingVs.length >= mainBattles && incomingVs.length <= mainBattles + 2) {
    const result = simulateRun(incomingVs.split(""));
    challenger = {
      n: incomingName,
      answers: buildFontRecords(result),
      championIndex: result.championIndex,
    };
  }
}

const state = {
  mode: challenger ? "intro-challenge" : "landing",
  battle: 1,
  championIndex: 0,
  outcomes: [],
  answers: [],
  finalsPool: [],
  finalsStep: 1,
};

// Carries across "take it again" / "challenge someone else" in the same
// sitting, so a person only has to type their name once per visit.
let myName = "";

function buildShareLink(outcomes, name){
  const url = new URL(location.href);
  url.search = "";
  url.searchParams.set("vs", outcomes.join(""));
  if (name) url.searchParams.set("who", name);
  return url.toString();
}

/* ---------------------------------------------------------
   RENDER
--------------------------------------------------------- */
const app = document.getElementById("app");

function render(){
  if (state.mode === "landing") return renderLanding();
  if (state.mode === "intro-challenge") return renderChallengeIntro();
  if (state.mode === "quiz") return renderQuiz();
  if (state.mode === "results-solo") return renderResultsSolo();
  if (state.mode === "results-challenge") return renderResultsChallenge();
  if (state.mode === "stats") return renderStats();
}

function goToStats(){
  state.mode = "stats";
  render();
}

function startQuiz(){
  state.mode = "quiz";
  state.battle = 1;
  state.championIndex = 0;
  state.outcomes = [];
  state.answers = [];
  state.finalsPool = [];
  state.finalsStep = 1;
  render();
}

function renderLanding(){
  app.innerHTML = `
    <div class="landing">
      <h1>Do your fonts&nbsp;match?</h1>
      <p class="lede">${FONT_POOL.length} fonts, one bracket. Your favorite stays on to face the next challenger, then your top 3 face off directly to confirm your real favorite. Send the link and find out who agrees with you.</p>
      <button class="cta" id="start-btn">Start the tournament</button>
      <div class="stats-link"><a href="#" id="stats-link">See how everyone else has answered →</a></div>
    </div>
  `;
  document.getElementById("start-btn").addEventListener("click", startQuiz);
  document.getElementById("stats-link").addEventListener("click", (e) => { e.preventDefault(); goToStats(); });
}

function renderChallengeIntro(){
  const name = challenger.n && challenger.n.trim() ? challenger.n.trim() : "Someone";
  app.innerHTML = `
    <div class="landing">
      <div class="challenge-banner">Incoming challenge</div>
      <h1>${escapeHtml(name)} wants to know if your fonts match.</h1>
      <p class="lede">Same ${FONT_POOL.length} fonts, same bracket. Pick your favorites and we'll show you a compatibility score based on how closely your taste actually lines up.</p>
      <button class="cta" id="start-btn">Take the tournament</button>
    </div>
  `;
  document.getElementById("start-btn").addEventListener("click", startQuiz);
}

function renderQuiz(){
  const champion = FONT_POOL[state.championIndex];
  const challengerFont = FONT_POOL[state.battle];
  const word = challengerFont.word;
  const totalBattles = FONT_POOL.length - 1;
  const ticks = Array.from({ length: totalBattles }, (_, i) => {
    const battleNum = i + 1;
    let cls = "tick";
    if (battleNum < state.battle) cls += " done";
    else if (battleNum === state.battle) cls += " current";
    return `<div class="${cls}"></div>`;
  }).join("");

  app.innerHTML = `
    <div class="ruler">${ticks}</div>
    <div class="round-label">Battle ${String(state.battle).padStart(2,"0")} / ${totalBattles}</div>
    <div class="round-word">Which setting of <b>“${word}”</b> feels more like you?</div>
    <div class="specimens">
      <div class="specimen" data-choice="champion" tabindex="0" role="button" aria-label="Keep the current favorite">
        <div class="specimen-badge">Your favorite so far</div>
        <div class="word" style="font-family:${champion.font}; font-size:${champion.size}px;">${escapeHtml(word)}</div>
      </div>
      <div class="specimen" data-choice="challenger" tabindex="0" role="button" aria-label="Switch to the new challenger">
        <div class="specimen-badge">New challenger</div>
        <div class="word" style="font-family:${challengerFont.font}; font-size:${challengerFont.size}px;">${escapeHtml(word)}</div>
      </div>
    </div>
    <button class="neutral-btn" id="neutral-btn">No strong preference</button>
  `;

  const cards = app.querySelectorAll(".specimen");
  cards.forEach(card => {
    const pick = () => choose(card.dataset.choice);
    card.addEventListener("click", pick);
    card.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pick(); } });
  });
  document.getElementById("neutral-btn").addEventListener("click", () => choose("neutral"));
}

function choose(outcome){
  const code = outcome === "champion" ? "c" : outcome === "challenger" ? "x" : "n";
  state.outcomes.push(code);
  if (outcome === "challenger") state.championIndex = state.battle;

  const chosenCard = outcome !== "neutral" ? app.querySelector(`.specimen[data-choice="${outcome}"]`) : null;
  if (chosenCard) chosenCard.classList.add("chosen");

  setTimeout(() => {
    state.battle += 1;
    if (state.battle < FONT_POOL.length){
      renderQuiz();
    } else {
      beginFinals();
    }
  }, 220);
}

function beginFinals(){
  const provisional = simulateRun(state.outcomes);
  state.finalsPool = provisional.finalists;
  state.finalsStep = 1;
  if (state.finalsPool.length < 2) {
    finishRun();
  } else {
    renderFinals();
  }
}

function renderFinals(){
  const pool = state.finalsPool;
  const step = state.finalsStep;
  const soFar = simulateRun(state.outcomes);
  const bestIdx = soFar.championIndex;
  const challengerIdx = pool[step];
  const bestFont = FONT_POOL[bestIdx];
  const challengerFont = FONT_POOL[challengerIdx];
  const word = challengerFont.word;

  app.innerHTML = `
    <div class="challenge-banner">Final round</div>
    <div class="round-label">Confirming your real favorite</div>
    <div class="round-word">Which setting of <b>“${word}”</b> do you actually prefer?</div>
    <div class="specimens">
      <div class="specimen" data-choice="champion" tabindex="0" role="button" aria-label="Keep the current favorite">
        <div class="specimen-badge">${step === 1 ? "Your top pick" : "Winner so far"}</div>
        <div class="word" style="font-family:${bestFont.font}; font-size:${bestFont.size}px;">${escapeHtml(word)}</div>
      </div>
      <div class="specimen" data-choice="challenger" tabindex="0" role="button" aria-label="Switch to the challenger">
        <div class="specimen-badge">${step === 1 ? "Your #2 pick" : "Your #3 pick"}</div>
        <div class="word" style="font-family:${challengerFont.font}; font-size:${challengerFont.size}px;">${escapeHtml(word)}</div>
      </div>
    </div>
    <button class="neutral-btn" id="neutral-btn">No strong preference</button>
  `;

  const cards = app.querySelectorAll(".specimen");
  cards.forEach(card => {
    const pick = () => chooseFinals(card.dataset.choice);
    card.addEventListener("click", pick);
    card.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pick(); } });
  });
  document.getElementById("neutral-btn").addEventListener("click", () => chooseFinals("neutral"));
}

function chooseFinals(outcome){
  const code = outcome === "champion" ? "c" : outcome === "challenger" ? "x" : "n";
  state.outcomes.push(code);

  const chosenCard = outcome !== "neutral" ? app.querySelector(`.specimen[data-choice="${outcome}"]`) : null;
  if (chosenCard) chosenCard.classList.add("chosen");

  setTimeout(() => {
    state.finalsStep += 1;
    if (state.finalsStep < state.finalsPool.length){
      renderFinals();
    } else {
      finishRun();
    }
  }, 220);
}

function finishRun(){
  const result = simulateRun(state.outcomes);
  state.answers = buildFontRecords(result);
  state.championIndex = result.championIndex;
  submitResult(state.answers, state.championIndex);
  state.mode = challenger ? "results-challenge" : "results-solo";
  render();
}

function submitResult(answers, championIndex){
  // Best-effort: adds this run's results to the anonymous group tallies.
  // If the site isn't deployed with its database yet, this silently
  // does nothing — the quiz itself never depends on it.
  const champion = answers[championIndex];
  const fonts = answers
    .filter(a => a.status !== "neutral")
    .map(a => ({
      key: a.key.replace(/'/g, ""),
      wins: a.wins,
      isChampion: a.status === "champion",
    }));
  try {
    fetch("/api/submit", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({
        fonts,
        championKey: champion.key.replace(/'/g, ""),
        category: champion.cat,
      }),
    }).catch(() => {});
  } catch (e) {}
}

function buildDominanceRows(result){
  return result.finalists.map((idx, pos) => {
    const font = FONT_POOL[idx];
    const name = font.font.replace(/'/g, "");
    const wins = result.wins[idx];
    const isChampion = idx === result.championIndex;
    return `
      <div class="dominance-row ${isChampion ? "champion" : ""}">
        <div class="dominance-rank">${isChampion ? "🏆" : "#" + (pos + 1)}</div>
        <div class="dominance-name" style="font-family:'${escapeHtml(name)}';">${escapeHtml(name)}</div>
        <div class="dominance-wins">${wins} ${wins === 1 ? "win" : "wins"}</div>
      </div>
    `;
  }).join("");
}

function renderPersonalityBlock(result, records){
  const championIdx = result.championIndex;
  const champion = records[championIdx];
  const championFontMeta = FONT_POOL[championIdx];
  const championName = champion.key.replace(/'/g, "");
  const dominantCategory = computeDominantCategory(records);

  return `
    <div class="champion-showcase">
      <div class="champion-label">Your favorite</div>
      <div class="champion-word" style="font-family:${champion.key};">${escapeHtml(championFontMeta.word)}</div>
      <div class="champion-name">${escapeHtml(championName)}</div>
    </div>
    <div class="stats-section">
      <div class="stats-heading">How it went</div>
      <div class="dominance-list">${buildDominanceRows(result)}</div>
    </div>
    <div class="stats-section">
      <div class="stats-heading">Your type personality</div>
      <p class="personality-text">${PERSONALITY_COPY[dominantCategory] || ""}</p>
    </div>
    <p class="result-sub">Share this link with a friend to see how compatible you really are.</p>
    <div class="name-box">
      <input id="name-input" type="text" maxlength="24" placeholder="Your name (shown on the link)" value="${escapeHtml(myName)}">
    </div>
    <div class="share-box">
      <input id="share-input" type="text" readonly value="">
      <button class="cta" id="copy-btn">Copy link</button>
    </div>
    <div class="copy-note" id="copy-note"></div>
  `;
}

function renderResultsSolo(){
  const result = simulateRun(state.outcomes);
  app.innerHTML = `
    <div class="result-kicker">Tournament complete</div>
    ${renderPersonalityBlock(result, state.answers)}
    <div class="btn-row">
      <button class="cta ghost" id="again-btn">Take it again</button>
    </div>
    <div class="affiliate-line">
      Curious about the typefaces you picked? <a id="explore-link" href="https://fonts.google.com" target="_blank" rel="noopener">Explore more type →</a>
      <!-- AFFILIATE SLOT: once you're accepted into a font marketplace's affiliate program
           (e.g. Adobe Fonts, Creative Market, MyFonts), swap the href above for your
           affiliate link. Consider making it specific to the fonts they picked. -->
    </div>
    <div class="stats-link"><a href="#" id="stats-link">See how everyone else has answered →</a></div>
  `;
  wireShare(state.outcomes);
  document.getElementById("again-btn").addEventListener("click", startQuiz);
  document.getElementById("stats-link").addEventListener("click", (e) => { e.preventDefault(); goToStats(); });
}

function buildStatement(myChampion, theirChampion, myChampionName, theirChampionName, theirPersonName){
  if (myChampion.key === theirChampion.key){
    return `You both fell hardest for ${myChampionName}.`;
  }
  if (myChampion.cat === theirChampion.cat){
    return `Different favorites, but you're both ${CATEGORY_PHRASE[myChampion.cat]} people at heart.`;
  }
  return `${theirPersonName}'s favorite was ${theirChampionName}; yours was ${myChampionName}.`;
}

function renderResultsChallenge(){
  const myResult = simulateRun(state.outcomes);
  const compat = computeCompatibility(state.answers, challenger.answers);
  const pct = compat ? compat.pct : 0;
  const name = challenger.n && challenger.n.trim() ? challenger.n.trim() : "Them";
  const heartScale = (0.55 + (pct / 100) * 0.65).toFixed(2);

  const myChampion = state.answers[state.championIndex];
  const theirChampion = challenger.answers[challenger.championIndex];
  const myChampionName = myChampion.key.replace(/'/g, "");
  const theirChampionName = theirChampion.key.replace(/'/g, "");
  const statement = compat
    ? buildStatement(myChampion, theirChampion, myChampionName, theirChampionName, name)
    : "Too many no-strong-preference picks between you to compare — try being a little more decisive next time.";

  const myRank = computeRanking(state.answers);
  const theirRank = computeRanking(challenger.answers);

  function renderRankList(rankOrder, records, otherRankOrder){
    const otherPos = {};
    otherRankOrder.forEach((idx, pos) => { otherPos[idx] = pos + 1; });
    return rankOrder.map((idx, pos) => {
      const myPos = pos + 1;
      const rec = records[idx];
      const font = FONT_POOL[idx];
      const fontName = rec.key.replace(/'/g, "");
      const otherRank = otherPos[idx];
      const closelyMatched = otherRank !== undefined && Math.abs(otherRank - myPos) <= 2;
      return `
        <div class="match-entry ${closelyMatched ? "match" : ""}">
          <span class="w">#${myPos} · ${escapeHtml(font.word)}</span>${escapeHtml(fontName)}
        </div>
      `;
    }).join("");
  }

  const theirEntries = renderRankList(theirRank, challenger.answers, myRank);
  const yourEntries = renderRankList(myRank, state.answers, theirRank);

  app.innerHTML = `
    <div class="result-kicker">Tournament complete</div>
    ${renderPersonalityBlock(myResult, state.answers)}

    <div class="result-kicker" style="margin-top:36px;">Type match</div>
    <div class="match-layout">
      <div class="match-col them">
        <div class="col-label">${escapeHtml(name)}</div>
        ${theirEntries}
      </div>
      <div class="match-center">
        <div class="heart-wrap" id="heart-wrap" style="--heart-scale:${heartScale};">
          <svg class="heart-svg heart-outline" viewBox="0 0 24 24" aria-hidden="true"><path d="${HEART_PATH}"/></svg>
          <svg class="heart-svg heart-fill" viewBox="0 0 24 24" aria-hidden="true" style="opacity:${pct/100};"><path d="${HEART_PATH}"/></svg>
        </div>
        <div class="match-pct">${pct}%</div>
        <div class="match-statement">${escapeHtml(statement)}</div>
      </div>
      <div class="match-col you">
        <div class="col-label">You</div>
        ${yourEntries}
      </div>
    </div>
    <div class="btn-row">
      <button class="cta ghost" id="again-btn">Take it again</button>
    </div>
    <div class="affiliate-line">
      Curious about the typefaces you picked? <a href="https://fonts.google.com" target="_blank" rel="noopener">Explore more type →</a>
    </div>
    <div class="stats-link"><a href="#" id="stats-link">See how everyone else has answered →</a></div>
  `;

  wireShare(state.outcomes);

  requestAnimationFrame(() => {
    const hw = document.getElementById("heart-wrap");
    if (hw) requestAnimationFrame(() => hw.classList.add("grown"));
  });

  document.getElementById("again-btn").addEventListener("click", startQuiz);
  document.getElementById("stats-link").addEventListener("click", (e) => { e.preventDefault(); goToStats(); });
}

function renderStats(){
  app.innerHTML = `<div class="stats-loading">Tallying everyone's picks…</div>`;

  fetch("/api/stats")
    .then(r => { if (!r.ok) throw new Error("bad response"); return r.json(); })
    .then(renderStatsData)
    .catch(() => {
      app.innerHTML = `
        <div class="result-kicker">Group results</div>
        <p class="result-sub">This page isn't connected to the results database yet. Once the site is deployed with D1 set up, it fills in on its own — nothing else to change here.</p>
        <div class="btn-row"><button class="cta ghost" id="back-btn">Back</button></div>
      `;
      document.getElementById("back-btn").addEventListener("click", () => {
        state.mode = challenger ? "intro-challenge" : "landing";
        render();
      });
    });
}

function renderStatsData(data){
  const totalPlayers = data.totalPlayers || 0;
  const fontRows = data.fonts || [];

  const leaderboard = fontRows
    .map(f => {
      const battles = f.wins + f.losses;
      const winRate = battles ? Math.round((f.wins / battles) * 100) : 0;
      return { key: f.font_key, wins: f.wins, losses: f.losses, championCount: f.champion_count, winRate, battles };
    })
    .filter(f => f.battles > 0)
    .sort((a, b) => b.winRate - a.winRate || b.battles - a.battles);

  const topFavorite = [...fontRows].sort((a, b) => b.champion_count - a.champion_count)[0];

  const totalCategoryVotes = (data.categories || []).reduce((sum, c) => sum + c.count, 0);
  const categoryBars = (data.categories || []).map(c => {
    const pct = totalCategoryVotes ? Math.round((c.count / totalCategoryVotes) * 100) : 0;
    return `
      <div class="stats-bar-row">
        <div class="stats-bar-label">${escapeHtml(TAG_LABEL[c.category] || c.category)}</div>
        <div class="stats-bar-track"><div class="stats-bar-fill" style="width:${pct}%"></div></div>
        <div class="stats-bar-pct">${pct}%</div>
      </div>
    `;
  }).join("");

  const leaderboardRows = leaderboard.slice(0, 8).map(f => `
    <div class="stats-round-row">
      <div class="w" style="font-family:'${escapeHtml(f.key)}'; text-transform:none; font-size:13px; color:var(--ink);">${escapeHtml(f.key)}</div>
      <div class="pick">${f.winRate}% win rate</div>
    </div>
  `).join("");

  app.innerHTML = `
    <div class="result-kicker">Group results</div>
    <div class="stats-total">${totalPlayers} ${totalPlayers === 1 ? "person has" : "people have"} taken the test</div>

    ${totalCategoryVotes ? `
      <div class="stats-section">
        <div class="stats-heading">Favorite type personalities so far</div>
        ${categoryBars}
      </div>
    ` : ""}

    ${topFavorite && topFavorite.champion_count > 0 ? `
      <div class="stats-callout">
        <b>Most common favorite:</b> ${escapeHtml(topFavorite.font_key)} has won the whole bracket for ${topFavorite.champion_count} ${topFavorite.champion_count === 1 ? "person" : "people"} so far.
      </div>
    ` : ""}

    ${leaderboardRows ? `
      <div class="stats-section">
        <div class="stats-heading">Font win rates, so far</div>
        ${leaderboardRows}
      </div>
    ` : ""}

    <div class="btn-row"><button class="cta ghost" id="back-btn">Back</button></div>
  `;

  document.getElementById("back-btn").addEventListener("click", () => {
    state.mode = challenger ? "intro-challenge" : "landing";
    render();
  });
}

function wireShare(outcomes){
  const nameInput = document.getElementById("name-input");
  const shareInput = document.getElementById("share-input");

  function refreshLink(){
    myName = nameInput.value.trim();
    shareInput.value = buildShareLink(outcomes, myName);
  }
  refreshLink();
  nameInput.addEventListener("input", refreshLink);

  document.getElementById("copy-btn").addEventListener("click", async () => {
    const note = document.getElementById("copy-note");
    try {
      await navigator.clipboard.writeText(shareInput.value);
      note.textContent = "Link copied.";
    } catch (e) {
      shareInput.select();
      note.textContent = "Press Ctrl/Cmd+C to copy.";
    }
    setTimeout(() => { note.textContent = ""; }, 2500);
  });
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
  }[c]));
}

render();
