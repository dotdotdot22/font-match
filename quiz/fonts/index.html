<style>

  .stats-loading{text-align:center;font-family:var(--mono);font-size:12px;color:var(--ink-soft);padding:60px 0;}

  .stats-section{margin-bottom:28px;}
  .stats-heading{font-family:var(--mono);font-size:11px;letter-spacing:0.08em;text-transform:uppercase;
    color:var(--ink-soft);margin-bottom:12px;}
  .stats-bar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:13px;}
  .stats-bar-label{width:150px;flex-shrink:0;}
  .stats-bar-track{flex:1;height:8px;background:var(--paper-shade);border-radius:4px;overflow:hidden;}
  .stats-bar-fill{height:100%;background:var(--accent);border-radius:4px;}
  .stats-bar-pct{width:38px;text-align:right;font-family:var(--mono);font-size:11px;color:var(--ink-soft);}
  .stats-callout{background:var(--accent-soft);border-radius:var(--radius);padding:14px 16px;font-size:13px;margin-bottom:28px;}
  .stats-round-row{display:flex;justify-content:space-between;gap:10px;padding:9px 11px;border:1px solid var(--line);

</style>

<body>
<div class="frame">
  <div class="topline">
    <span><a href="/">quizheart</a> / Font Match</span>
    <span class="mark" aria-hidden="true"></span>
  </div>
  <div id="app"></div>
  <footer>Pick your favorites. Find out your type. See who agrees with you.</footer>
</div>
<script>
/* =========================================================
   THE FONTS
   32 typefaces across seven style categories. Fixed order and
   fixed count — the share link replays a run against this exact
   list, so changing it invalidates every link already sent out.
========================================================= */
const FONT_POOL = [
  { font:"'Playfair Display'", size:44, cat:"serif" },
  { font:"'Cormorant Garamond'", size:46, cat:"serif" },
  { font:"'Libre Baskerville'", size:30, cat:"serif" },
  { font:"'EB Garamond'", size:42, cat:"serif" },
  { font:"'Bodoni Moda'", size:40, cat:"serif" },
  { font:"'Spectral'", size:38, cat:"serif" },
  { font:"'DM Sans'", size:38, cat:"sans" },
  { font:"'Oswald'", size:36, cat:"sans" },
  { font:"'Nunito Sans'", size:34, cat:"sans" },
  { font:"'Barlow'", size:36, cat:"sans" },
  { font:"'Work Sans'", size:36, cat:"sans" },
  { font:"'Poppins'", size:34, cat:"sans" },
  { font:"'Bebas Neue'", size:40, cat:"display" },
  { font:"'Big Shoulders Display'", size:36, cat:"display" },
  { font:"'Bangers'", size:38, cat:"display" },
  { font:"'Lobster'", size:36, cat:"display" },
  { font:"'Orbitron'", size:32, cat:"display" },
  { font:"'Shrikhand'", size:34, cat:"display" },
  { font:"'Caveat'", size:50, cat:"script" },
  { font:"'Dancing Script'", size:46, cat:"script" },
  { font:"'Great Vibes'", size:46, cat:"script" },
  { font:"'Parisienne'", size:44, cat:"script" },
  { font:"'Tangerine'", size:54, cat:"script" },
  { font:"'Alex Brush'", size:44, cat:"script" },
  { font:"'Space Mono'", size:34, cat:"mono" },
  { font:"'IBM Plex Mono'", size:32, cat:"mono" },
  { font:"'Silkscreen'", size:28, cat:"mono" },
  { font:"'Cutive Mono'", size:32, cat:"mono" },
  { font:"'Courier Prime'", size:34, cat:"mono" },
  { font:"'VT323'", size:40, cat:"mono" },
  { font:"'Alfa Slab One'", size:32, cat:"slab" },
  { font:"'Bitter'", size:36, cat:"slab" },
  { font:"'Zilla Slab'", size:36, cat:"slab" },
  { font:"'Josefin Slab'", size:38, cat:"slab" },
  { font:"'Roboto Slab'", size:36, cat:"slab" },
  { font:"'Arvo'", size:34, cat:"slab" },
  { font:"'UnifrakturMaguntia'", size:36, cat:"blackletter" },
  { font:"'Pirata One'", size:34, cat:"blackletter" },
  { font:"'Grenze Gotisch'", size:40, cat:"blackletter" },
  { font:"'MedievalSharp'", size:38, cat:"blackletter" },
  { font:"'Metal Mania'", size:38, cat:"blackletter" },
  { font:"'Almendra Display'", size:38, cat:"blackletter" },
  { font:"'Chewy'", size:36, cat:"bubble" },
  { font:"'Fredoka'", size:36, cat:"bubble" },
  { font:"'Baloo 2'", size:36, cat:"bubble" },
  { font:"'Bubblegum Sans'", size:36, cat:"bubble" },
  { font:"'Sniglet'", size:34, cat:"bubble" },
  { font:"'Titan One'", size:32, cat:"bubble" },
];

const CATEGORY_ROTATION = ["serif","sans","display","script","mono","slab","blackletter","bubble"];

const TAG_LABEL = {
  serif:"Classic & Serif-Leaning", sans:"Clean & Modern", display:"Bold & Maximalist",
  script:"Playful & Expressive", mono:"Technical & Precise", slab:"Sturdy & Slab-Serif",
  blackletter:"Dramatic & Gothic", bubble:"Soft & Rounded",
};
const CATEGORY_PHRASE = {
  serif:"serif type", sans:"clean sans-serif type", display:"bold display type",
  script:"playful script type", mono:"technical monospace type", slab:"sturdy slab type",
  blackletter:"dramatic blackletter type", bubble:"soft rounded type",
};
const CATEGORY_SHORT = {
  serif:"serif", sans:"sans-serif", display:"display", script:"script",
  mono:"monospace", slab:"slab serif", blackletter:"blackletter", bubble:"bubble",
};
const PERSONALITY_COPY = {
  serif:"You're drawn to serif type — classic, dependable, built to be taken seriously. You probably value clear communication and don't go looking for unnecessary flash.",
  sans:"You're drawn to clean sans-serif type — modern, minimal, no clutter. You likely value simplicity and directness over decoration.",
  display:"You're drawn to bold display type — big, loud, impossible to ignore. You're probably artsy and a little eccentric, and you don't mind standing out.",
  script:"You're drawn to script and cursive type — flowing, expressive, personal. You likely lead with feeling over rigid structure.",
  mono:"You're drawn to monospace type — precise, technical, orderly. You probably think in systems and like things lined up just right.",
  slab:"You're drawn to slab serif type — sturdy, confident, no-nonsense. You value reliability and don't waste time on subtlety.",
  blackletter:"You're drawn to blackletter and gothic type — dramatic, intense, larger than life. You've got a flair for the theatrical.",
  bubble:"You're drawn to soft, rounded bubble type — friendly, warm, a bit silly on purpose. You'd rather put someone at ease than impress them.",
};

const HEART_PATH = "M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z";
const SAMPLE_TEXT = "The quick brown fox jumps over the lazy dog";
function sentenceSize(f){ return Math.max(16, Math.round(f.size * 0.55)); }

/* =========================================================
   THE LADDER
   Round 1 puts all 32 fonts into 16 fixed pairs, so every font
   is judged at least once and nothing sits out. After that the
   field halves: the best 16 play, then the best 8, 4, and 2.
   Standing is by Elo rating across the whole pool, so a font
   that loses a close battle to a strong opponent can still make
   the next round. Pairing is strongest-against-weakest, which
   keeps the two front-runners apart until the final.
   31 battles in total.
========================================================= */
function buildOpeningPairs(){
  const buckets = {};
  CATEGORY_ROTATION.forEach(c => { buckets[c] = []; });
  FONT_POOL.forEach((f,i) => buckets[f.cat].push(i));
  const order = [];
  let added = true;
  while (added){
    added = false;
    for (const cat of CATEGORY_ROTATION){
      if (buckets[cat].length){ order.push(buckets[cat].shift()); added = true; }
    }
  }
  const pairs = [];
  for (let k = 0; k < order.length; k += 2) pairs.push([order[k], order[k+1]]);
  for (let k = 0; k < pairs.length - 1; k++){
    if (FONT_POOL[pairs[k][0]].cat === FONT_POOL[pairs[k][1]].cat){
      const t = pairs[k][1]; pairs[k][1] = pairs[k+1][1]; pairs[k+1][1] = t;
    }
  }
  return pairs;
}
const OPENING_PAIRS = buildOpeningPairs();
const LADDER_SIZES = [16, 8, 4, 2];
const TOTAL_BATTLES = OPENING_PAIRS.length + LADDER_SIZES.reduce((s,n) => s + n/2, 0);
const ROUND_NAMES = ["Opening round","Round of 16","Quarter-finals","Semi-finals","The final"];

const ELO_START = 1000, ELO_K = 32;

// Position of a font within its own category, and where that category sits
// in the rotation. Used only to break ties, below.
const CAT_SLOT = (() => {
  const count = {}, slot = [];
  FONT_POOL.forEach((f,i) => { count[f.cat] = (count[f.cat] || 0); slot[i] = count[f.cat]++; });
  return slot;
})();
const CAT_ORDER = i => CATEGORY_ROTATION.indexOf(FONT_POOL[i].cat);

// Fonts that have played, best rating first; then anything not yet played.
//
// Ties matter more than they look. After the opening round every winner has
// beaten one untested opponent, so all 24 hold the identical rating, and the
// cut to the best 16 is decided entirely by the tie-break. Breaking ties by
// position in FONT_POOL quietly handed those places to whichever categories
// were listed first — a blackletter fan could sweep all six blackletter
// battles and still see the style vanish before round two. Ties are now
// broken by taking one font from each category in turn, so an equal score
// gets equal representation.
function rankByRating(rating, played){
  const seen = [], unseen = [];
  for (let i = 0; i < FONT_POOL.length; i++) (played[i] ? seen : unseen).push(i);
  seen.sort((a,b) =>
    rating[b] - rating[a] ||
    CAT_SLOT[a] - CAT_SLOT[b] ||
    CAT_ORDER(a) - CAT_ORDER(b) ||
    a - b);
  return seen.concat(unseen);
}

// Which two fonts appear in a given battle. Depends only on the ratings
// produced by earlier battles, so replaying an outcome string rebuilds
// the identical schedule on someone else's screen.
function scheduleFor(battleNo, rating, played){
  if (battleNo <= OPENING_PAIRS.length){
    const p = OPENING_PAIRS[battleNo - 1];
    return { left:p[0], right:p[1], round:0 };
  }
  let n = battleNo - OPENING_PAIRS.length;
  for (let r = 0; r < LADDER_SIZES.length; r++){
    const size = LADDER_SIZES[r], count = size / 2;
    if (n <= count){
      const pool = rankByRating(rating, played).slice(0, size);
      return { left:pool[n-1], right:pool[size-n], round:r+1 };
    }
    n -= count;
  }
  return null;
}

// Standard Elo, the same maths chess ratings use. Beating a proven
// opponent gains a lot; beating an untested one barely moves anything.
// This is what lets fonts that played different numbers of battles be
// compared fairly against each other.
function simulateRun(outcomes){
  const rating = new Array(FONT_POOL.length).fill(ELO_START);
  const wins = new Array(FONT_POOL.length).fill(0);
  const losses = new Array(FONT_POOL.length).fill(0);
  const pickCount = new Array(FONT_POOL.length).fill(0);
  const played = new Array(FONT_POOL.length).fill(false);

  function applyElo(a, b){
    const expA = 1 / (1 + Math.pow(10, (rating[b] - rating[a]) / 400));
    rating[a] += ELO_K * (1 - expA);
    rating[b] += ELO_K * (0 - (1 - expA));
  }

  let championIndex = null;
  for (let b = 1; b <= TOTAL_BATTLES; b++){
    const sched = scheduleFor(b, rating, played);
    const code = outcomes[b-1];
    if (code === undefined){
      return { rating, wins, losses, pickCount, played, championIndex:null,
               nextBattle:b, nextSchedule:sched, ranking:rankByRating(rating, played),
               complete:false };
    }
    const winner = code === "x" ? sched.right : sched.left;
    const loser  = code === "x" ? sched.left  : sched.right;
    played[sched.left] = true; played[sched.right] = true;
    applyElo(winner, loser);
    wins[winner] += 1; losses[loser] += 1; pickCount[winner] += 1;
    championIndex = winner;
  }
  return { rating, wins, losses, pickCount, played, championIndex,
           nextBattle:null, nextSchedule:null, ranking:rankByRating(rating, played),
           complete:true };
}

function buildFontRecords(result){
  return FONT_POOL.map((f,i) => ({
    key:f.font, cat:f.cat, wins:result.wins[i], losses:result.losses[i],
    pickCount:result.pickCount[i], rating:result.rating[i], played:result.played[i],
  }));
}

function computeRanking(records){
  return records.map((r,i) => ({ i, rating:r.rating, played:r.played }))
    .filter(r => r.played)
    .sort((a,b) => b.rating - a.rating || a.i - b.i)
    .map(r => r.i);
}

// Which style this person actually leans on, measured across every battle
// they won rather than just the category of the single winning font.
function computeCategoryLeans(records){
  const totals = {};
  records.forEach(r => { if (r.played) totals[r.cat] = (totals[r.cat]||0) + r.pickCount; });
  const order = Object.keys(totals).sort((a,b) => totals[b]-totals[a] || a.localeCompare(b));
  const sum = Object.values(totals).reduce((s,v) => s+v, 0) || 1;
  return order.map(cat => ({ cat, count:totals[cat], pct: Math.round(totals[cat]/sum*100) }));
}

/* Compatibility is measured over the fonts either person rated in their
   top 10 — the part of the list their answers actually tested. Comparing
   the full 32 buried real agreement under noise from the bottom of the
   list, where nobody has a strong opinion anyway. */
const COMPAT_TOP = 10;
function computeCompatibility(mine, theirs){
  const A = computeRanking(mine), B = computeRanking(theirs);
  if (!A.length || !B.length) return null;
  const pa = {}, pb = {};
  A.forEach((x,p) => { pa[x] = p+1; });
  B.forEach((x,p) => { pb[x] = p+1; });
  const pool = new Set([...A.slice(0,COMPAT_TOP), ...B.slice(0,COMPAT_TOP)]);
  let ws = 0, wt = 0;
  pool.forEach(i => {
    const ra = pa[i] === undefined ? A.length+1 : pa[i];
    const rb = pb[i] === undefined ? B.length+1 : pb[i];
    const sim = Math.max(0, 1 - Math.abs(ra-rb)/COMPAT_TOP);
    const w = (COMPAT_TOP*2 + 2) - Math.min(ra, rb);
    ws += sim*w; wt += w;
  });
  return { pct: Math.round(ws/wt*100) };
}

/* =========================================================
   STATE
========================================================= */
const params = new URLSearchParams(location.search);
const incomingVs = params.get("vs");
const incomingName = params.get("who") || "";

let challenger = null;
if (incomingVs && /^[cx]+$/.test(incomingVs) && incomingVs.length === TOTAL_BATTLES){
  const result = simulateRun(incomingVs.split(""));
  challenger = { n:incomingName, answers:buildFontRecords(result), championIndex:result.championIndex };
}

const state = { mode: challenger ? "intro-challenge" : "landing", outcomes:[], answers:[], championIndex:null };
let myName = "";

function buildShareLink(outcomes, name){
  const url = new URL(location.href);
  url.search = "";
  url.searchParams.set("vs", outcomes.join(""));
  if (name) url.searchParams.set("who", name);
  return url.toString();
}

/* =========================================================
   RENDER
========================================================= */
const app = document.getElementById("app");

function render(){
  if (state.mode === "landing") return renderLanding();
  if (state.mode === "intro-challenge") return renderChallengeIntro();
  if (state.mode === "quiz") return renderQuiz();
  if (state.mode === "results-solo") return renderResultsSolo();
  if (state.mode === "results-challenge") return renderResultsChallenge();
  if (state.mode === "stats") return renderStats();
}
function goToStats(){ state.mode = "stats"; render(); }
function startQuiz(){ state.mode = "quiz"; state.outcomes = []; state.answers = []; state.championIndex = null; render(); }

function renderLanding(){
  app.innerHTML = `
    <div class="landing">
      <h1>What's your font&nbsp;personality?</h1>
      <p class="lede">${FONT_POOL.length} typefaces, six from each of eight styles, so no style has a head start. Every font gets judged, then the ones you liked play each other until a favourite is left standing. ${TOTAL_BATTLES} quick picks. Send the link to a friend afterwards and see how your taste compares.</p>
      <button class="cta" id="start-btn">Start the quiz</button>
      <div class="stats-link"><a href="#" id="stats-link">See how everyone else has answered &rarr;</a></div>
      <div class="stats-link"><a href="/">&larr; More quizzes on quizheart</a></div>
    </div>`;
  document.getElementById("start-btn").addEventListener("click", startQuiz);
  document.getElementById("stats-link").addEventListener("click", e => { e.preventDefault(); goToStats(); });
}

function renderChallengeIntro(){
  const name = challenger.n && challenger.n.trim() ? challenger.n.trim() : "Someone";
  app.innerHTML = `
    <div class="landing">
      <div class="challenge-banner">Incoming challenge</div>
      <h1>${escapeHtml(name)} wants to know if your fonts match.</h1>
      <p class="lede">Same ${FONT_POOL.length} fonts, same ${TOTAL_BATTLES} picks. We'll show you a compatibility score based on how closely your taste actually lines up.</p>
      <button class="cta" id="start-btn">Take the quiz</button>
    </div>`;
  document.getElementById("start-btn").addEventListener("click", startQuiz);
}

// The progress bar is split into round blocks, so it's visible that the
// quiz narrows as it goes rather than being one flat run of battles.
function renderRuler(currentBattle){
  const blocks = [OPENING_PAIRS.length, ...LADDER_SIZES.map(n => n/2)];
  let seen = 0;
  return `<div class="ruler">` + blocks.map(count => {
    const ticks = Array.from({length:count}, (_,k) => {
      const n = seen + k + 1;
      let cls = "tick";
      if (n < currentBattle) cls += " done";
      else if (n === currentBattle) cls += " current";
      return `<div class="${cls}"></div>`;
    }).join("");
    seen += count;
    return `<div class="rgroup" style="--w:${count}">${ticks}</div>`;
  }).join("") + `</div>`;
}

function renderQuiz(){
  const soFar = simulateRun(state.outcomes);
  const s = soFar.nextSchedule;
  const battleNo = soFar.nextBattle;
  const left = FONT_POOL[s.left], right = FONT_POOL[s.right];
  const roundName = ROUND_NAMES[s.round];
  const isLadder = s.round > 0;

  app.innerHTML = `
    ${renderRuler(battleNo)}
    <div class="round-name">${roundName}</div>
    <div class="round-label">Pick ${String(battleNo).padStart(2,"0")} / ${TOTAL_BATTLES}</div>
    <div class="round-word">${isLadder ? "Both of these did well. Which one wins?" : "Which one feels more like you?"}</div>
    <div class="specimens">
      <div class="specimen" data-choice="left" tabindex="0" role="button" aria-label="Choose the left typeface">
        <div class="specimen-badge">${isLadder ? "Higher seed" : "&nbsp;"}</div>
        <div class="word" style="font-family:${left.font};font-size:${sentenceSize(left)}px;">${SAMPLE_TEXT}</div>
        <div class="specimen-fontname">${escapeHtml(left.font.replace(/'/g,""))}</div>
      </div>
      <div class="specimen" data-choice="right" tabindex="0" role="button" aria-label="Choose the right typeface">
        <div class="specimen-badge">${isLadder ? "Lower seed" : "&nbsp;"}</div>
        <div class="word" style="font-family:${right.font};font-size:${sentenceSize(right)}px;">${SAMPLE_TEXT}</div>
        <div class="specimen-fontname">${escapeHtml(right.font.replace(/'/g,""))}</div>
      </div>
    </div>`;

  app.querySelectorAll(".specimen").forEach(card => {
    const pick = () => choose(card.dataset.choice);
    card.addEventListener("click", pick);
    card.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " "){ e.preventDefault(); pick(); } });
  });
}

function choose(side){
  const code = side === "left" ? "c" : "x";
  const chosen = app.querySelector(`.specimen[data-choice="${side}"]`);
  const other = app.querySelector(`.specimen[data-choice="${side === "left" ? "right" : "left"}"]`);
  if (chosen) chosen.classList.add("chosen");
  if (other) other.classList.add("not-chosen");
  setTimeout(() => {
    state.outcomes.push(code);
    if (state.outcomes.length < TOTAL_BATTLES) renderQuiz();
    else finishRun();
  }, 420);
}

function finishRun(){
  const result = simulateRun(state.outcomes);
  state.answers = buildFontRecords(result);
  state.championIndex = result.championIndex;
  submitResult(state.answers, state.championIndex);
  state.mode = challenger ? "results-challenge" : "results-solo";
  render();
}

function submitResult(answers, championIndex){
  // Anonymous group tallies. Best-effort: if the database isn't reachable
  // the quiz carries on regardless and nothing is lost but a statistic.
  const fonts = answers.filter(a => a.played).map((a,i) => ({
    key:a.key.replace(/'/g,""), wins:a.wins, losses:a.losses,
    isChampion: answers.indexOf(a) === championIndex,
  }));
  try {
    fetch("/api/submit", {
      method:"POST", headers:{ "content-type":"application/json" },
      body: JSON.stringify({
        quiz:"fonts",
        fonts,
        championKey: answers[championIndex].key.replace(/'/g,""),
        category: answers[championIndex].cat,
      }),
    }).catch(() => {});
  } catch (e) {}
}

function buildTopRows(result, records){
  return result.ranking.slice(0,5).map((idx,pos) => {
    const name = FONT_POOL[idx].font.replace(/'/g,"");
    const isChampion = idx === result.championIndex;
    const plays = result.wins[idx] + result.losses[idx];
    return `
      <div class="dominance-row ${isChampion ? "champion" : ""}">
        <div class="dominance-rank">${isChampion ? "\u{1F3C6}" : "#" + (pos+1)}</div>
        <div class="dominance-name" style="font-family:'${escapeHtml(name)}';">${escapeHtml(name)}</div>
        <div class="dominance-wins">won ${result.wins[idx]} of ${plays}</div>
      </div>`;
  }).join("");
}

function renderPersonalityBlock(result, records){
  const champion = records[result.championIndex];
  const championName = champion.key.replace(/'/g,"");
  const leans = computeCategoryLeans(records);
  const primary = leans[0], secondary = leans[1];
  const secondLine = secondary && secondary.count > 0
    ? `<p class="lean-note">Your picks were <b>${primary.pct}% ${CATEGORY_SHORT[primary.cat]}</b>, with <b>${CATEGORY_SHORT[secondary.cat]}</b> a clear second at ${secondary.pct}%.</p>` : "";
  return `
    <div class="champion-showcase">
      <div class="champion-label">Your favourite</div>
      <div class="champion-word" style="font-family:${champion.key};">${escapeHtml(championName)}</div>
    </div>
    <div class="stats-section">
      <div class="stats-heading">Your top five</div>
      <div class="dominance-list">${buildTopRows(result, records)}</div>
    </div>
    <div class="stats-section">
      <div class="stats-heading">Your type personality</div>
      <p class="personality-text">${PERSONALITY_COPY[primary.cat] || ""}</p>
      ${secondLine}
    </div>`;
}

function renderSharePrompt(){
  return `
    <p class="result-sub">Share this link with a friend to see how compatible you really are.</p>
    <div class="name-box">
      <input id="name-input" type="text" maxlength="24" placeholder="Your name (shown on the link)" value="${escapeHtml(myName)}">
    </div>
    <div class="share-box">
      <input id="share-input" type="text" readonly value="">
      <button class="cta" id="copy-btn">Copy link</button>
    </div>
    <div class="copy-note" id="copy-note"></div>`;
}

function renderResultsSolo(){
  const result = simulateRun(state.outcomes);
  app.innerHTML = `
    <div class="result-kicker">Your results</div>
    ${renderPersonalityBlock(result, state.answers)}
    ${renderSharePrompt()}
    <div class="btn-row"><button class="cta ghost" id="again-btn">Take it again</button><a class="cta ghost" href="/" style="text-decoration:none;">More quizzes</a></div>
    <div class="affiliate-line">
      Curious about the typefaces you picked? <a href="https://fonts.google.com" target="_blank" rel="noopener">Explore more type &rarr;</a>
      <!-- AFFILIATE SLOT: swap this href for your marketplace affiliate link once approved. -->
    </div>
    <div class="stats-link"><a href="#" id="stats-link">See how everyone else has answered &rarr;</a></div>`;
  wireShare(state.outcomes);
  document.getElementById("again-btn").addEventListener("click", startQuiz);
  document.getElementById("stats-link").addEventListener("click", e => { e.preventDefault(); goToStats(); });
}

function buildStatement(mine, theirs, myName_, theirName_, person){
  if (mine.key === theirs.key) return `You both fell hardest for ${myName_}.`;
  if (mine.cat === theirs.cat) return `Different favourites, but you're both ${CATEGORY_PHRASE[mine.cat]} people at heart.`;
  return `${person}'s favourite was ${theirName_}; yours was ${myName_}.`;
}

function renderResultsChallenge(){
  const myResult = simulateRun(state.outcomes);
  const compat = computeCompatibility(state.answers, challenger.answers);
  const pct = compat ? compat.pct : 0;
  const name = challenger.n && challenger.n.trim() ? challenger.n.trim() : "Them";
  const heartScale = (0.55 + (pct/100)*0.65).toFixed(2);
  const mine = state.answers[state.championIndex];
  const theirs = challenger.answers[challenger.championIndex];
  const statement = buildStatement(mine, theirs, mine.key.replace(/'/g,""), theirs.key.replace(/'/g,""), name);
  const myRank = computeRanking(state.answers);
  const theirRank = computeRanking(challenger.answers);

  function rankList(order, records, otherOrder){
    const otherPos = {};
    otherOrder.forEach((idx,pos) => { otherPos[idx] = pos+1; });
    return order.slice(0,10).map((idx,pos) => {
      const mePos = pos+1, rec = records[idx];
      const them = otherPos[idx];
      const close = them !== undefined && Math.abs(them - mePos) <= 2;
      return `<div class="match-entry ${close ? "match" : ""}">
        <span class="w">#${mePos}</span><span style="font-family:${rec.key};">${escapeHtml(rec.key.replace(/'/g,""))}</span>
      </div>`;
    }).join("");
  }

  app.innerHTML = `
    <div class="result-kicker">Your results</div>
    ${renderPersonalityBlock(myResult, state.answers)}
    <div class="result-kicker" style="margin-top:36px;">Your compatibility with ${escapeHtml(name)}</div>
    <div class="match-center">
      <div class="heart-wrap" id="heart-wrap" style="--heart-scale:${heartScale};">
        <svg class="heart-svg heart-outline" viewBox="0 0 24 24" aria-hidden="true"><path d="${HEART_PATH}"/></svg>
        <svg class="heart-svg heart-fill" viewBox="0 0 24 24" aria-hidden="true" style="opacity:${pct/100};"><path d="${HEART_PATH}"/></svg>
      </div>
      <div class="match-pct">${pct}%</div>
      <div class="match-statement">${escapeHtml(statement)}</div>
    </div>
    ${renderSharePrompt()}
    <div class="stats-heading" style="margin-top:8px;">Your top tens, side by side</div>
    <div class="match-breakdown">
      <div class="match-col them"><div class="col-label">${escapeHtml(name)}</div>${rankList(theirRank, challenger.answers, myRank)}</div>
      <div class="match-col you"><div class="col-label">You</div>${rankList(myRank, state.answers, theirRank)}</div>
    </div>
    <div class="btn-row"><button class="cta ghost" id="again-btn">Take it again</button><a class="cta ghost" href="/" style="text-decoration:none;">More quizzes</a></div>
    <div class="affiliate-line">
      Curious about the typefaces you picked? <a href="https://fonts.google.com" target="_blank" rel="noopener">Explore more type &rarr;</a>
    </div>
    <div class="stats-link"><a href="#" id="stats-link">See how everyone else has answered &rarr;</a></div>`;

  wireShare(state.outcomes);
  requestAnimationFrame(() => {
    const hw = document.getElementById("heart-wrap");
    if (hw) requestAnimationFrame(() => hw.classList.add("grown"));
  });
  document.getElementById("again-btn").addEventListener("click", startQuiz);
  document.getElementById("stats-link").addEventListener("click", e => { e.preventDefault(); goToStats(); });
}

function renderStats(){
  app.innerHTML = `<div class="stats-loading">Tallying everyone's picks&hellip;</div>`;
  fetch("/api/stats?quiz=fonts")
    .then(r => { if (!r.ok) throw new Error("bad response"); return r.json(); })
    .then(renderStatsData)
    .catch(() => {
      app.innerHTML = `
        <div class="result-kicker">Group results</div>
        <p class="result-sub">The results database isn't answering right now. Nothing is lost — try again in a moment.</p>
        <div class="btn-row"><button class="cta ghost" id="back-btn">Back</button></div>`;
      document.getElementById("back-btn").addEventListener("click", () => {
        state.mode = challenger ? "intro-challenge" : "landing"; render();
      });
    });
}

function renderStatsData(data){
  const totalPlayers = data.totalPlayers || 0;
  const fontRows = data.fonts || [];

  // Ranked by how often a font was somebody's outright favourite, as a
  // share of everyone who played. Win rate was misleading here: it mostly
  // measured how many battles a font happened to be handed.
  const favourites = fontRows
    .map(f => ({ key:f.font_key, champs:f.champion_count || 0,
                 pct: totalPlayers ? Math.round((f.champion_count/totalPlayers)*100) : 0 }))
    .filter(f => f.champs > 0)
    .sort((a,b) => b.champs - a.champs || a.key.localeCompare(b.key));

  const totalCat = (data.categories || []).reduce((s,c) => s + c.count, 0);
  const categoryBars = (data.categories || []).map(c => {
    const pct = totalCat ? Math.round((c.count/totalCat)*100) : 0;
    return `<div class="stats-bar-row">
      <div class="stats-bar-label">${escapeHtml(TAG_LABEL[c.category] || c.category)}</div>
      <div class="stats-bar-track"><div class="stats-bar-fill" style="width:${pct}%"></div></div>
      <div class="stats-bar-pct">${pct}%</div></div>`;
  }).join("");

  const favRows = favourites.slice(0,8).map(f => `
    <div class="stats-round-row">
      <div style="font-family:'${escapeHtml(f.key)}';font-size:14px;color:var(--ink);">${escapeHtml(f.key)}</div>
      <div class="pick">${f.pct}% picked it</div>
    </div>`).join("");

  app.innerHTML = `
    <div class="result-kicker">Group results</div>
    <div class="stats-total">${totalPlayers} ${totalPlayers === 1 ? "person has" : "people have"} taken the test</div>
    ${totalCat ? `<div class="stats-section"><div class="stats-heading">Favourite type personalities so far</div>${categoryBars}</div>` : ""}
    ${favourites.length ? `<div class="stats-callout"><b>Most common favourite:</b> ${escapeHtml(favourites[0].key)}, the top pick for ${favourites[0].champs} ${favourites[0].champs === 1 ? "person" : "people"}.</div>` : ""}
    ${favRows ? `<div class="stats-section"><div class="stats-heading">How often each font won outright</div>${favRows}</div>` : ""}
    <div class="btn-row"><button class="cta ghost" id="back-btn">Back</button></div>`;

  document.getElementById("back-btn").addEventListener("click", () => {
    state.mode = challenger ? "intro-challenge" : "landing"; render();
  });
}

function wireShare(outcomes){
  const nameInput = document.getElementById("name-input");
  const shareInput = document.getElementById("share-input");
  function refresh(){ myName = nameInput.value.trim(); shareInput.value = buildShareLink(outcomes, myName); }
  refresh();
  nameInput.addEventListener("input", refresh);
  document.getElementById("copy-btn").addEventListener("click", async () => {
    const note = document.getElementById("copy-note");
    try { await navigator.clipboard.writeText(shareInput.value); note.textContent = "Link copied."; }
    catch (e) { shareInput.select(); note.textContent = "Press Ctrl/Cmd+C to copy."; }
    setTimeout(() => { note.textContent = ""; }, 2500);
  });
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}

render();
</script>
